  .idea.hit { background: var(--p-soft); }
  .idea.hit i { background: var(--p-green); color: #fff; }
  .model { border-radius: 15px; padding: 12px 14px; background: #fff; border: 1px solid var(--p-track); font-size: 15px; }
  .model b { display: block; font: 600 11.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--p-kick); margin-bottom: 6px; }
  .verdict { font: 500 22px/1.2 var(--serif); margin: 0; }

  .tip { border-radius: 15px; padding: 12px 14px; background: var(--p-soft); font-size: 15px; }
  .think { color: var(--p-kick); font: 500 14px var(--sans); text-align: center; }

  .desk { width: min(760px, 100%); display: flex; flex-direction: column; gap: 14px; }
  .sum { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }

  .claims { display: flex; flex-direction: column; gap: 8px; }

  .claim.ok { border-color: var(--ok); }

  .claim .t { font-size: 15px; line-height: 1.4; min-width: 0; }
  .claim .s { grid-column: 1 / -1; font-size: 13px; color: var(--mute); line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
  .claim .s a { color: var(--accent); }
  .mark { font: 700 11.5px/1 var(--sans); letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
  .mark.solid { background: var(--ok-soft); color: var(--ok); }

  .mark.flagged { background: var(--bad-soft); color: var(--bad); }
  .acts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
  .acts button { border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 9px; font: 600 13px var(--sans); padding: 6px 11px; cursor: pointer; }
  .acts button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .lock { grid-column: 1 / -1; font-size: 13px; color: var(--bad); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .mic.on::after { animation: none; } }
</style>

        h += '<div class="grade"><span class="kick">The coach</span>' + rows.map(function (rw) { var g = G[rw[0]] || {}; var m = ["Yes", "Partly", "No"].indexOf(g.mark) >= 0 ? g.mark : "Partly"; return '<div class="g"><span class="pill ' + m + '">' + m + '</span><div><b>' + rw[1] + '</b><span>' + esc(g.why || "") + '</span></div></div>'; }).join("") +
          (G.tip ? '<div class="tip"><b>One tip.</b> ' + esc(G.tip) + '</div>' : "") + '</div>';
        b.innerHTML = h; foot(NEXT(DONE, "Finish") + '<button class="btn ghost" type="button" data-go="' + PICK + '">Try another voter</button>');
      } else { h += '<p class="think">The coach is grading your door…</p>'; b.innerHTML = h; foot('<button class="btn" type="button" disabled>Grading…</button>'); }
      return;
    }
    if (d.busy) { h += '<p class="think">' + v.name + ' is answering…</p>'; b.innerHTML = h; foot('<button class="btn" type="button" disabled>…</button>'); return; }
    h += voiceBlock(d.r);
    b.innerHTML = h; foot(voiceFoot(d.r));
  }
  function startDoor(k) {
    S.voter = k; S.door = { turns: [{ me: false, text: VOTERS[k].open }], step: 0, r: {}, ended: false, grade: null, busy: false };
    go(DOOR); speak(VOTERS[k].open, VOTERS[k]);
  }
  function said(text) {
    var d = S.door, v = VOTERS[S.voter];
    d.turns.push({ me: true, text: text }); d.r = {};
    var mine = d.turns.filter(function (t) { return t.me; });
    if (sample) { liveVoter(); return; }
    var asked = /(vote|voting|ballot|polls|early|tuesday|plan)/.test(norm(text));
    if (mine.length >= 2 || (asked && d.step >= 1)) { d.turns.push({ me: false, text: v.bye }); speak(v.bye, v); endDoor(); return; }
    d.step = 1; d.turns.push({ me: false, text: v.follow }); render(); speak(v.follow, v);
  }
  function transcript() { var v = VOTERS[S.voter]; return S.door.turns.map(function (t) { return (t.me ? "CANVASSER: " : v.name.toUpperCase() + ": ") + t.text; }).join("\n"); }
  async function liveVoter() {
    var d = S.door, v = VOTERS[S.voter]; d.busy = true; render();
    var mine = d.turns.filter(function (t) { return t.me; }).length;
    var p = "You are role-playing a voter at a front door in Georgia so a canvasser for Keisha Lance Bottoms (Democratic candidate for governor, election Tuesday, November 3, 2026; opponent Republican Rick Jackson) can practice. Topic: Medicaid and Georgia Pathways.\n\nYOUR CHARACTER: " + v.who +
      "\n\nRULES: Stay in character. One or two short spoken sentences, plain words, no stage directions. React honestly to what the canvasser actually said. " + (mine >= 2 ? "Wrap up now in character and end your line with [door closes]." : "If they ask you to make a plan to vote, wrap up and end with [door closes].") +
      "\n\nWhat the canvasser is supposed to know (for your reactions only):\n- " + KEY + "\n\nTHE DOOR SO FAR\n" + transcript() + "\n\nWrite only " + v.name + "'s next line.";
    try {
      var res = await sample(p, { modelTier: "quick", cache: false });
      var line = res.text.replace(/^\s*[A-Za-z]+:\s*/, "").trim(), close = /\[door closes\]/i.test(line);
      line = line.replace(/\s*\[door closes\]\s*/i, " ").trim();
      d.busy = false; d.turns.push({ me: false, text: line }); speak(line, v);
      if (close || mine >= 3) endDoor(); else { d.step++; render(); }
    } catch (e) { sample = null; d.busy = false; var lastMine = d.turns.pop(); said(lastMine.text); }
  }
  async function endDoor() {
    var d = S.door; d.ended = true; render();
    var g = scriptGrade();
    if (sample) {
      try {
        var p = "Grade a canvasser's practice door for Keisha Lance Bottoms's campaign for governor of Georgia. Grade only the CANVASSER's lines (speech-to-text, so ignore punctuation).\n\nANSWER KEY:\n- " + KEY + "\n\nTHE DOOR\n" + transcript() +
          "\n\nGrade \"Yes\", \"Partly\" or \"No\" with one short sentence of why (under 20 words): accurate (everything matched the key; inventing a position, number or date, or guessing instead of offering a follow-up, is No), short (one or two sentences each time), vote (turned back to the plan to vote). Then one tip quoting their own words (under 30 words). Reply with only JSON: {\"accurate\":{\"mark\":\"Yes\",\"why\":\"\"},\"short\":{\"mark\":\"Yes\",\"why\":\"\"},\"vote\":{\"mark\":\"Yes\",\"why\":\"\"},\"tip\":\"\"}";
        var a = await sample.json(p, { cache: false }); if (a && a.accurate) g = a;
      } catch (e) {}
    }
    d.grade = g; if (S.i === DOOR) render();
  }
  function scriptGrade() {
    var mine = S.door.turns.filter(function (t) { return t.me; }).map(function (t) { return t.text; });
    var all = norm(mine.join(" . "));
    var wrong = /(no work requirement|without work requirement|everyone gets|free health|for free|jackson('s| is)? (against|lying|a liar)|liar)/.test(all);
    var right = /(expan|pathways|rural|hospital|follow up|get back to you)/.test(all);
    var long = mine.filter(function (t) { return t.split(/\s+/).length > 40; }).length;
    var vote = /(vote|voting|ballot|polls|early|tuesday|plan)/.test(all);
    var G = {
      accurate: wrong ? { mark: "No", why: "Something you said doesn’t match what Keisha has said." } : right ? { mark: "Yes", why: "What you said matches her positions." } : { mark: "Partly", why: "Nothing wrong, but you didn’t say where Keisha stands." },
      short: long === 0 ? { mark: "Yes", why: "Each answer stayed short." } : long === 1 ? { mark: "Partly", why: "One answer ran long." } : { mark: "No", why: "Your answers ran long." },
      vote: vote ? { mark: "Yes", why: "You came back to the plan to vote." } : { mark: "No", why: "You didn’t ask about their plan to vote." }
    };
    G.tip = wrong ? "Stick to the line: “Keisha wants full Medicaid expansion and to end Pathways.”" : !right ? "Give them Keisha’s position in one sentence before you ask." : !vote ? "End every answer with a question like “When are you planning to vote?”" : long ? "Two sentences is plenty at a door." : "That’s a door a field director would be happy with.";
    return G;
  }

  /* ---------- events ---------- */
  function currentR() {
    if (S.i >= TEST_START && S.i <= TEST_END) { var k = S.i - TEST_START; S.t[k] = S.t[k] || {}; return S.t[k]; }
    if (S.i === DOOR && S.door) return S.door.r;
    return null;
  }
  function onSaid(text) {
    if (S.i >= TEST_START && S.i <= TEST_END) gradeTest(S.i - TEST_START, text);
    else if (S.i === DOOR) said(text);
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.go != null) { go(+t.dataset.go); return; }
    if (t.dataset.voter != null) { startDoor(+t.dataset.voter); return; }
    if (t.dataset.rv || t.id === "all" || t.id === "live") return;
    var r;
    switch (t.id) {
      case "back": go(S.i === DOOR ? PICK : Math.max(0, S.i - 1)); break;
      case "hearanchor": speak(ANCHOR, COACH); break;
      case "hearvoter": var lv = S.door.turns.filter(function (x) { return !x.me; }).slice(-1)[0]; if (lv) speak(lv.text, VOTERS[S.voter]); break;
      case "mic": r = currentR(); if (!r) break; if (r.listening) finishListening(); else listen(r, onSaid); break;
      case "mic2": finishListening(); break;
      case "micretry": r = currentR(); if (r) { r.error = ""; listen(r, onSaid); } break;
      case "typed": r = currentR(); var ta = $("said"); var txt = ta ? ta.value.trim() : ""; if (r && txt) { r.text = txt; onSaid(txt); } break;
      case "retry": var k = S.i - TEST_START; S.t[k] = {}; render(); break;
      case "v-can": setView("can"); break;
      case "v-dir": setView("dir"); break;
    }
  });

  /* ---------- the field director view ---------- */
  var CLAIMS = [
    ["The question and the problem", [
      ["About 200,000 poor Georgia adults are in the coverage gap: too much for Medicaid, too little to afford coverage.", "solid", "Georgia Recorder, via Cobb County Courier · Sep 14, 2026", "https://cobbcountycourier.com/2026/09/is-jacksons-intelligent-medicaid-expansion-weak-tea-or-a-revolutionary-fix/"],
      ["40 states expanded Medicaid; Georgia did not.", "solid", "Georgia Recorder, via Cobb County Courier · Sep 14, 2026", "https://cobbcountycourier.com/2026/09/is-jacksons-intelligent-medicaid-expansion-weak-tea-or-a-revolutionary-fix/"],
      ["The example (two part-time jobs, no insurance) is an illustration, not a real person.", "inferred", "Written by Warmup from the lesson’s check 1; labeled “An example” on screen", ""],
      ["Georgia built its own program, Pathways, tying coverage to reported work hours.", "solid", "GPB News, Oct 1, 2026; ProPublica, Feb 19, 2025", "https://www.propublica.org/article/georgia-medicaid-work-requirement-pathways-to-coverage-hurdles"],
      ["Kemp’s team expected about 100,000 to qualify; just over 18,500 are covered.", "solid", "Georgia Recorder (100,000); WRDW, Aug 19, 2026 (18,500)", "https://www.wrdw.com/2026/08/19/georgia-seeks-higher-federal-match-pathways-health-coverage-program/"],
      ["Small towns have watched hospitals and labor and delivery units close.", "solid", "Bottoms, WTOC, Oct 20, 2026; Georgia Hospital Association via WRDW, Sep 1, 2026", "https://www.wrdw.com/2026/09/01/federal-funding-arrives-hospital-closures-continue-across-georgia/"]
    ]],
    ["Keisha’s plan", [
      ["Full expansion to 138 percent of the poverty line, about $21,000 a year for one person.", "solid", "Bottoms CARE Plan (PDF) · April 2026", "https://www.keishaforgovernor.com/klb-policy-careplan-1.pdf"],
      ["End Pathways; “an epic failure in the state.”", "solid", "WTOC · Oct 20, 2026", "https://wtoc.com/2026/10/20/bottoms-focuses-campaign-affordability-calls-data-center-pause"],
      ["She can’t expand alone (“I will not have the power unilaterally to expand Medicaid”); day one she readies state agencies, then pushes the legislature.", "solid", "AJC, Jul 31, 2026; debate release, Apr 27, 2026", "https://www.ajc.com/politics/2026/07/bottoms-wants-to-expand-medicaid-in-georgia-but-can-she/"],
      ["Rural Care First pays rural hospitals and clinics more.", "solid", "Bottoms CARE Plan; issues page", "https://www.keishaforgovernor.com/issues"]
    ]],
    ["Jackson’s plan", [
      ["“Intelligent Medicaid expansion”; he rejects full expansion.", "solid", "Atlanta News First, Sep 8, 2026; GPB News, Oct 1, 2026", "https://www.atlantanewsfirst.com/2026/09/08/work-requirements-or-full-coverage-georgia-governor-hopefuls-roll-out-healthcare-proposals/"],
      ["Day one he brings lawmakers a program for adults like Pathways, with work requirements; it needs a federal waiver; details not published.", "solid", "GPB News · Oct 1, 2026; Georgia Recorder, Sep 14, 2026", "https://www.gpb.org/news/2026/10/01/medicaid-work-requirements-are-here-stay-no-matter-who-wins-georgia-governors-race"],
      ["Under federal law, expansion will come with work rules either way (about 80 hours a month).", "solid", "GPB News · Oct 1, 2026", "https://www.gpb.org/news/2026/10/01/medicaid-work-requirements-are-here-stay-no-matter-who-wins-georgia-governors-race"],
      ["“Build on its model” summarizes his program “like Pathways.”", "inferred", "Warmup’s wording of GPB’s description; the campaign should confirm the phrase", ""]
    ]],
    ["What changes", [
      ["If Keisha wins, the governor pushes for full expansion and ends Pathways; if Jackson wins, a program like Pathways with work requirements. Either way the legislature has a say.", "inferred", "Each side follows from its own stated plan above; the legislature’s role from Bottoms (AJC) and Jackson (GPB)", ""]
    ]],
    ["Kept out of the lesson", [
      ["Her claim that nine rural hospitals closed because Georgia didn’t expand.", "flagged", "Her CARE Plan says nine since 2010; the Georgia Hospital Association counts 18 since 2013; the cause is stated as fact", ""],
      ["Her claim that 500,000 Georgians dropped health care since January.", "flagged", "Campaign release, Aug 7, 2026; conflicts with the AJC’s 190,000-plus", ""],
      ["What happens to people already on Pathways under her plan.", "flagged", "Not published as of Oct 30, 2026", ""]
    ]]
  ];
  var RV = {}, LIVE = false;
  function setView(v) {
    $("v-can").setAttribute("aria-pressed", String(v === "can")); $("v-dir").setAttribute("aria-pressed", String(v === "dir"));
    $("phone").hidden = v !== "can"; $("desk").hidden = v !== "dir";
    if (v === "dir") { stopAll(); renderDesk(); }
  }
  function renderDesk() {
    var total = 0, done = 0, cuts = 0, h = "";
    CLAIMS.forEach(function (sec, si) {
      h += '<p class="sec">' + esc(sec[0]) + '</p><div class="claims">';
      sec[1].forEach(function (c, ci) {
        var key = si + "-" + ci, st = RV[key], flag = c[1] === "flagged";
        if (!flag) { total++; if (st === "ok") done++; if (st === "cut") cuts++; }
        h += '<div class="claim' + (st === "ok" ? " ok" : st === "cut" ? " cut" : "") + '"><div class="t">' + esc(c[0]) + '</div><span class="mark ' + c[1] + '">' + c[1] + '</span>' +
          '<div class="s">' + (c[3] ? '<a href="' + esc(c[3]) + '" target="_blank" rel="noopener">' + esc(c[2]) + '</a>' : esc(c[2])) + '</div>' +
          (flag ? '<div class="lock">Can’t go live until the campaign confirms it.</div>' : '<div class="acts"><button type="button" data-rv="' + key + '" data-to="ok" aria-pressed="' + (st === "ok") + '">Approve</button><button type="button" data-rv="' + key + '" data-to="cut" aria-pressed="' + (st === "cut") + '">Cut</button></div>') + '</div>';
      });
      h += '</div>';
    });
    var ready = done + cuts === total;
    $("desk").innerHTML = '<div class="sum"><div><h2>' + (LIVE ? "Live for your canvassers" : "Review before anything goes live") + '</h2><p>' + (LIVE ? "Keisha’s lesson and its questions are now in every canvasser’s Warmup." : done + " of " + total + " claims approved · 3 kept out until you confirm them") + '</p></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' + (LIVE ? "" : '<button type="button" class="golive alt" id="all">Approve all solid</button>') +
      '<button type="button" class="golive' + (LIVE ? " done" : "") + '" id="live"' + (ready && !LIVE ? "" : " disabled") + '>' + (LIVE ? "Live" : "Send to canvassers") + '</button></div></div>' + h;
  }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t || $("desk").hidden) return;
    if (t.dataset.rv) { var k = t.dataset.rv; if (RV[k] === t.dataset.to) delete RV[k]; else RV[k] = t.dataset.to; LIVE = false; renderDesk(); }
    else if (t.id === "all") { CLAIMS.forEach(function (sec, si) { sec[1].forEach(function (c, ci) { if (c[1] === "solid") RV[si + "-" + ci] = "ok"; }); }); renderDesk(); }
    else if (t.id === "live") { LIVE = true; renderDesk(); }
  });

  render();
  if (IN_CLAUDE && claude.use) claude.use("sample").then(function (s) { sample = s; }).catch(function () { sample = null; });
})();
</script>
