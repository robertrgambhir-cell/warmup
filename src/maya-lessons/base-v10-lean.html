<title>Maya Kaur Lessons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
  /* Layout: one phone in the Warmup app's look, skinned for the demo campaign (Maya Kaur). Home lists five lessons; each lesson teaches, then asks you to say it back, then puts you at a cartoon voter's door. The phone keeps the app's light look in every theme. */
  :root {
    --bg: #efe9df; --fg: #2b2723; --mute: #6f685f; --line: #ddd5c8; --panel: #f7f3ec; --accent: #1b7a4d;
    --p-bg: #fcf8f2; --p-card: #f4eee5; --p-ink: #262320; --p-muted: #5b554d; --p-kick: #6f685f;
    --p-green: #35b57c; --p-deep: #1b7a4d; --p-soft: #dff2e8; --p-track: #e6dfd3; --p-red: #b3261e; --p-red-soft: #f8e1de;
    --p-k: #2f6f9f; --p-k-soft: #e3eef7; --p-j: #8d4b3c; --p-j-soft: #f6e6e1; --p-door: #e9dccb; --p-src: #fff4dc; --p-src-ink: #6b4a00;
    --maya: #1F4C91;
    --serif: "Newsreader", Georgia, serif; --sans: "Figtree", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1c1a17; --fg: #efe9df; --mute: #a39b90; --line: #39342e; --panel: #26221e; --accent: #5cc995; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1c1a17; --fg: #efe9df; --mute: #a39b90; --line: #39342e; --panel: #26221e; --accent: #5cc995; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45; }
  .wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding-block: 14px 26px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .fine { width: min(560px, 100%); color: var(--mute); font-size: 12.5px; text-align: center; margin: 0; text-wrap: balance; }
  button:focus-visible, a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .phone { position: relative; width: min(402px, 100%); height: clamp(640px, calc(100svh - 90px), 800px); background: var(--p-bg); color: var(--p-ink); border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 18px 48px -24px rgba(40,30,10,.35); border: 1px solid rgba(0,0,0,.06); }
  .ph-head { display: flex; align-items: center; gap: 10px; padding: 18px 18px 8px; min-height: 64px; }
  .camp-mark { display: inline-grid; justify-items: stretch; color: var(--maya); font-family: var(--sans); text-transform: uppercase; line-height: 1; }
  .camp-mark b { font-weight: 800; font-size: 24px; letter-spacing: -0.01em; line-height: .92; white-space: nowrap; }
  .camp-mark small { font-weight: 700; font-size: 8.1px; letter-spacing: .04em; line-height: 1; margin-top: 4px; white-space: nowrap; }
  .back { margin-left: auto; border: 0; background: var(--p-card); color: var(--p-ink); width: 34px; height: 34px; border-radius: 50%; font: 600 17px/1 var(--sans); cursor: pointer; }
  .prog { padding: 4px 18px 0; }
  .prog .lab { display: flex; justify-content: space-between; font: 600 11px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--p-kick); margin-bottom: 7px; }
  .prog .lab span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; }
  .prog .lab span:last-child { flex: none; }
  .bars { display: grid; grid-template-columns: 6fr 5fr 2fr; gap: 5px; }
  .bar { height: 6px; border-radius: 99px; background: var(--p-track); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--p-green); border-radius: 99px; transition: width .4s cubic-bezier(.2,.8,.2,1); }
  .ph-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 20px 8px; display: flex; flex-direction: column; gap: 14px; }
  .ph-foot { padding: 8px 18px 18px; display: flex; flex-direction: column; gap: 8px; }
  .btn { display: block; width: 100%; height: 54px; border: 0; border-radius: 18px; background: var(--p-ink); color: #fff; font: 600 17px/54px var(--sans); cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--p-ink); border: 1.5px solid var(--p-track); height: 46px; line-height: 43px; font-size: 15px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .kick { font: 600 12px/1.2 var(--sans); letter-spacing: .13em; text-transform: uppercase; color: var(--p-kick); }
  .h { font: 500 30px/1.12 var(--serif); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
  .h.sm { font-size: 24px; }
  .lead { font-size: 16.5px; line-height: 1.5; margin: 0; }
  .muted { color: var(--p-muted); }
  q { font-family: var(--serif); font-style: italic; font-size: 1.06em; quotes: "“" "”"; }
  .pw-line { display: flex; align-items: center; justify-content: center; gap: 5px; margin: 0; font: 600 11.5px var(--sans); color: var(--p-kick); }

  .hello { display: flex; gap: 14px; align-items: center; }
  .portrait { flex: none; width: 92px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .portrait .ph { width: 92px; height: 92px; border-radius: 50%; overflow: hidden; background: #dbe5f3; border: 3px solid var(--maya); }
  .portrait .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .portrait small { font-size: 10px; line-height: 1.2; color: var(--p-kick); text-align: center; }
  .hello p { margin: 0; font: 500 19px/1.3 var(--serif); }
  .lessons { display: flex; flex-direction: column; gap: 8px; }
  .lesson { text-align: left; border: 0; background: var(--p-card); border-radius: 18px; padding: 13px 14px; cursor: pointer; color: var(--p-ink); display: flex; gap: 12px; align-items: center; font: inherit; }
  .lesson .n { flex: none; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font: 600 15px/1 var(--sans); background: #fff; color: var(--p-ink); border: 1.5px solid var(--p-track); }
  .lesson.done .n { background: var(--p-green); border-color: var(--p-green); color: #fff; }
  .lesson div { min-width: 0; }
  .lesson b { display: block; font: 600 16px/1.25 var(--sans); }
  .lesson span { display: block; font-size: 13px; color: var(--p-muted); line-height: 1.3; margin-top: 3px; }
  .src { background: var(--p-src); color: var(--p-src-ink); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.4; }
  .src b { font-weight: 700; }
  .reveal { background: var(--p-src); color: var(--p-src-ink); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .reveal .kick { color: var(--p-src-ink); }
  .reveal p { margin: 0; font: 500 19px/1.35 var(--serif); color: var(--p-ink); }
  .reveal p.muted { font: 400 14.5px/1.45 var(--sans); color: var(--p-muted); }
  .reveal .srcbtn { align-self: flex-start; }
  .pts { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .pts li { background: var(--p-k-soft); border-radius: 14px; padding: 11px 13px 11px 36px; position: relative; font-size: 15.5px; line-height: 1.42; }
  .pts li::before { content: ""; position: absolute; left: 14px; top: 17px; width: 9px; height: 9px; border-radius: 50%; background: var(--p-k); }
  .pts li b { font-weight: 700; color: var(--p-k); }
  .msg { display: flex; gap: 11px; align-items: flex-start; background: var(--p-card); border-radius: 18px; padding: 13px 14px; font: 400 17px/1.4 var(--serif); }
  .msg img { flex: none; width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 2px solid var(--maya); }
  .msg small { display: block; font: 700 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--maya); margin-bottom: 5px; }
  .road { display: flex; flex-direction: column; gap: 10px; }
  .step { display: flex; gap: 12px; align-items: flex-start; }
  .step i { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--p-ink); color: #fff; display: grid; place-items: center; font: 700 14px/1 var(--sans); font-style: normal; }
  .step b { display: block; font: 600 16px/1.2 var(--sans); }
  .step span { display: block; font-size: 14px; color: var(--p-muted); line-height: 1.35; margin-top: 2px; }
  .goal { margin: 0; background: var(--p-soft); color: var(--p-deep); border-radius: 14px; padding: 11px 13px; font: 600 14.5px/1.4 var(--sans); }
  .lesson.open { background: #fff; border: 1.5px solid var(--p-green); }
  .lesson.open .n { background: var(--p-ink); border-color: var(--p-ink); color: #fff; }
  .lesson.locked { cursor: default; opacity: .62; }
  .lesson.locked .n { color: var(--p-kick); }
  .srcbtn { border: 0; background: none; color: var(--p-src-ink); font: 700 13.5px var(--sans); text-decoration: underline; padding: 0; cursor: pointer; }
  .srclist { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .srclist li { background: var(--p-card); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.4; overflow-wrap: anywhere; }
  .srclist a { color: var(--p-deep); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font: 600 13px/1.2 var(--sans); padding: 8px 11px; border-radius: 99px; background: var(--p-card); color: var(--p-muted); }
  .chip.k { background: var(--p-k-soft); color: var(--p-k); }
  .chip.j { background: var(--p-j-soft); color: var(--p-j); }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--p-card); border-radius: 16px; padding: 12px 14px; }
  .stat b { display: block; font: 600 28px/1 var(--serif); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--p-muted); line-height: 1.3; display: block; margin-top: 5px; }
  .gapbar { display: grid; grid-template-columns: 1.1fr 1.5fr 1.4fr; border-radius: 14px; overflow: hidden; font: 600 12.5px/1.25 var(--sans); }
  .gapbar div { padding: 14px 10px; min-height: 86px; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; }
  .gapbar .a { background: var(--p-soft); color: var(--p-deep); }
  .gapbar .g { background: repeating-linear-gradient(135deg, #f7e2c3 0 8px, #f2d6ae 8px 16px); color: #6b4300; }
  .gapbar .c { background: var(--p-card); color: var(--p-muted); }
  .gapbar b { font: 600 22px/1 var(--serif); color: #6b4300; }
  .axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--p-kick); margin-top: -8px; }
  .ex { background: var(--p-card); border-radius: 16px; padding: 12px 14px; font-size: 15px; }
  .ex b { display: block; font: 600 11.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--p-kick); margin-bottom: 6px; }
  .scale { display: flex; flex-direction: column; gap: 10px; }
  .scale .row { display: flex; flex-direction: column; gap: 5px; }
  .scale .row span { font-size: 13.5px; color: var(--p-muted); }
  .scale .row b { font: 600 20px/1 var(--serif); color: var(--p-ink); font-variant-numeric: tabular-nums; }
  .track { height: 18px; border-radius: 6px; background: var(--p-track); overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 6px; }
  .cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cmp .hd { font: 600 14px/1.2 var(--sans); padding: 10px; border-radius: 12px 12px 4px 4px; color: #fff; }
  .cmp .hd small { display: block; font: 500 11.5px/1.2 var(--sans); opacity: .85; margin-top: 2px; }
  .cmp .hd.k { background: var(--p-k); } .cmp .hd.j { background: var(--p-j); }
  .cmp .rl { grid-column: 1 / -1; font: 600 11.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--p-kick); padding: 8px 2px 0; }
  .cmp .c { font-size: 14px; line-height: 1.4; padding: 9px 10px; border-radius: 10px; }
  .cmp .c.k { background: var(--p-k-soft); } .cmp .c.j { background: var(--p-j-soft); }
  .cmp .c.both { grid-column: 1 / -1; background: var(--p-card); text-align: center; }
  .win { border-radius: 16px; padding: 13px 15px; display: flex; flex-direction: column; gap: 5px; }
  .win.k { background: var(--p-k-soft); } .win.j { background: var(--p-j-soft); }
  .win b { font: 600 13px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; }
  .win.k b { color: var(--p-k); } .win.j b { color: var(--p-j); }
  .win span { font: 500 18px/1.3 var(--serif); }
  .anchor { background: var(--p-ink); color: #fff; border-radius: 20px; padding: 18px; font: 500 21px/1.34 var(--serif); }
  .anchor em { font-style: normal; border-bottom: 2px solid; }
  .anchor .k { color: #9ecbef; } .anchor .j { color: #f0b9a8; }
  .hear { align-self: flex-start; border: 1.5px solid var(--p-track); background: #fff; color: var(--p-ink); border-radius: 99px; padding: 8px 14px; font: 600 14px var(--sans); cursor: pointer; }

  .qcard { background: var(--p-card); border-radius: 18px; padding: 16px; }
  .mic { width: 112px; height: 112px; border-radius: 50%; border: 0; background: var(--p-ink); color: #fff; display: grid; place-items: center; cursor: pointer; align-self: center; margin-top: 6px; position: relative; }
  .mic svg { width: 40px; height: 40px; }
  .mic.on { background: var(--p-red); }
  .mic.on::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--p-red); opacity: .45; animation: pulse 1.4s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.92); opacity: .55; } 100% { transform: scale(1.18); opacity: 0; } }
  .miclab { text-align: center; font: 600 14px var(--sans); color: var(--p-kick); margin-top: -4px; }
  .heard { background: #fff; border: 1px solid var(--p-track); border-radius: 16px; padding: 12px 14px; font: 400 17px/1.4 var(--serif); min-height: 52px; }
  .heard small { display: block; font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--p-kick); margin-bottom: 6px; }
  .ideas { display: flex; flex-direction: column; gap: 6px; }
  .idea { display: flex; gap: 10px; align-items: center; font-size: 15px; padding: 9px 12px; border-radius: 12px; background: var(--p-card); }
  .idea i { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--sans); font-style: normal; background: var(--p-track); color: var(--p-muted); }
  .idea.hit { background: var(--p-soft); }
  .idea.hit i { background: var(--p-green); color: #fff; }
  .model { border-radius: 15px; padding: 12px 14px; background: #fff; border: 1px solid var(--p-track); font-size: 15px; }
  .model b { display: block; font: 600 11.5px/1 var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--p-kick); margin-bottom: 6px; }
  .verdict { font: 500 22px/1.2 var(--serif); margin: 0; }
  .card-alert { background: var(--p-red-soft); border-radius: 16px; padding: 14px; font-size: 15px; }
  .tray textarea { width: 100%; border: 1.5px solid var(--p-track); background: #fff; color: var(--p-ink); border-radius: 14px; padding: 11px 13px; font: 400 16px/1.4 var(--sans); resize: none; }
  .note { font-size: 13.5px; color: var(--p-muted); background: var(--p-card); border-radius: 14px; padding: 10px 12px; }
  .score { display: flex; gap: 6px; }
  .score i { flex: 1; height: 10px; border-radius: 99px; background: var(--p-track); }
  .score i.on { background: var(--p-green); }

  .voters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .voter { border: 0; background: var(--p-card); border-radius: 18px; padding: 10px 10px 12px; cursor: pointer; color: var(--p-ink); display: flex; flex-direction: column; align-items: center; gap: 4px; font: inherit; text-align: center; }
  .voter svg { width: 84px; height: 84px; }
  .voter b { font-size: 16px; }
  .voter span { font-size: 12.5px; color: var(--p-muted); line-height: 1.25; }
  .stage { position: relative; background: linear-gradient(var(--p-door), #e2d3bf); border-radius: 22px; padding: 18px 14px 0; display: flex; flex-direction: column; align-items: center; overflow: hidden; min-height: 280px; }
  .stage::before { content: ""; position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 62%; bottom: 0; background: #cdb89c; border-radius: 10px 10px 0 0; }
  .stage svg { position: relative; width: 170px; height: 170px; margin-top: 96px; }
  .say { position: absolute; left: 12px; right: 12px; top: 12px; background: #fff; border-radius: 16px; padding: 10px 12px; font: 400 16.5px/1.35 var(--serif); box-shadow: 0 6px 18px -10px rgba(0,0,0,.35); z-index: 1; }
  .say small { display: block; font: 600 11px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--p-kick); margin-bottom: 4px; }
  .grade { display: flex; flex-direction: column; gap: 8px; }
  .gr { display: flex; gap: 10px; align-items: flex-start; background: var(--p-card); border-radius: 15px; padding: 11px 13px; }
  .pill { flex: none; font: 700 12px/1 var(--sans); padding: 6px 9px; border-radius: 99px; }
  .pill.Yes { background: var(--p-green); color: #fff; }
  .pill.Partly { background: #e8c46b; color: #3b2b00; }
  .pill.No { background: var(--p-red); color: #fff; }
  .gr div b { display: block; font-size: 14.5px; }
  .gr div span { font-size: 14px; color: var(--p-muted); }
  .tip { border-radius: 15px; padding: 12px 14px; background: var(--p-soft); font-size: 15px; }
  .think { color: var(--p-kick); font: 500 14px var(--sans); text-align: center; }

  /* story cards */
  .phone.story-on .ph-head, .phone.story-on .prog, .phone.story-on .ph-foot { display: none; }
  .phone.story-on .ph-body { padding: 0; gap: 0; overflow: hidden; }
  .story { position: relative; flex: 1; display: flex; flex-direction: column; padding: 12px 20px 16px; color: var(--p-ink); cursor: pointer; user-select: none; -webkit-user-select: none; overflow: hidden; }
  .story.dark { color: #fff; }
  .st-seg { display: flex; gap: 4px; }
  .st-seg i { flex: 1; height: 3px; border-radius: 3px; background: currentColor; opacity: .18; }
  .st-seg i.full, .st-seg i.cur { opacity: .85; }
  .st-top { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; font-size: 13.5px; }
  .st-top img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1.5px solid currentColor; }
  .st-top span { opacity: .65; }
  .st-x { margin-left: auto; border: 0; background: none; color: inherit; font: 600 18px/1 var(--sans); width: 34px; height: 34px; cursor: pointer; opacity: .75; }
  .st-body { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 14px; padding: 10px 0; }
  .st-kick { font: 700 12px/1.2 var(--sans); letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
  .st-h { margin: 0; font: 500 29px/1.12 var(--serif); letter-spacing: -.015em; text-wrap: balance; }
  .st-h.lg { font-size: 38px; line-height: 1.04; }
  .st-h.xl { font-size: 50px; line-height: 1; }
  .st-h em { font-style: italic; }
  .st-red { color: #b3261e; }
  .st-p { margin: 0; font-size: 17px; line-height: 1.45; }
  .st-p.small { font-size: 14.5px; opacity: .8; }
  .st-p.dim { opacity: .72; }
  .st-big { font: 600 76px/0.95 var(--serif); letter-spacing: -.03em; font-variant-numeric: tabular-nums; color: #8a4b05; }
  .st-next { border: 0; border-radius: 99px; height: 54px; background: var(--p-ink); color: #fff; font: 600 17px/54px var(--sans); cursor: pointer; flex: none; }
  .story.dark .st-next { background: #fff; color: #1d1c22; }
  .st-hint { margin: 8px 0 0; text-align: center; font-size: 11.5px; opacity: .45; }
  .st-cover { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
  .st-photo { width: 116px; height: 116px; border-radius: 50%; padding: 4px; background: linear-gradient(135deg,#ffd27a,#ff8a5c,#e2557a); }
  .st-photo img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #1F4C91; display: block; }
  .st-quote { margin: 4px 0 0; font: 400 21px/1.36 var(--serif); font-style: italic; }
  .st-quote small { display: block; font: 700 12px/1 var(--sans); font-style: normal; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin-top: 10px; }
  .st-steps { display: flex; gap: 6px; flex-wrap: wrap; }
  .st-steps span { display: inline-flex; align-items: center; gap: 6px; font: 600 13px/1 var(--sans); padding: 8px 11px 8px 8px; border-radius: 99px; background: rgba(255,255,255,.14); }
  .st-steps i { width: 20px; height: 20px; border-radius: 50%; background: #fff; color: #1F4C91; display: grid; place-items: center; font: 800 11px/1 var(--sans); font-style: normal; }
  .st-gap { width: 100%; height: auto; }

      { name: "Marcus", meta: "Warehouse worker, Gwinnett", skin: "#6b4430", hair: "#120d0b", style: "short", shirt: "#3f7d5e", voice: ["Tom", "Aaron", "Alex"], pitch: .95, rate: 1.05, open: "Hey. Real quick, what’s she going to do about data centers? My light bill is crazy.", follow: "Okay. And on health care, what’s the difference between her and the other guy?", bye: "Cool. I’ll get my vote in. Appreciate you." }],
    key: "Bottoms wants full Medicaid expansion to adults up to 138 percent of the poverty line (about $21,000 a year for one person), like 40 other states, and to end Georgia Pathways, which she calls an epic failure. She can't expand alone: day one she readies state agencies, then pushes the legislature. Her Rural Care First plan pays rural hospitals and clinics more. About 200,000 poor Georgia adults are in the coverage gap; Pathways covers about 18,500, where about 100,000 were expected. Under federal law, expansion will come with work rules. Jackson rejects full expansion and promises \"intelligent Medicaid expansion\": a program like Pathways with work requirements that needs a federal waiver; details not published. Anything else: offer the campaign follow-up.",
    sources: [["Georgia Recorder via Cobb County Courier, Sep 14, 2026", "https://cobbcountycourier.com/2026/09/is-jacksons-intelligent-medicaid-expansion-weak-tea-or-a-revolutionary-fix/"], ["WRDW, Aug 19, 2026 (Pathways enrollment)", "https://www.wrdw.com/2026/08/19/georgia-seeks-higher-federal-match-pathways-health-coverage-program/"], ["Bottoms CARE Plan, April 2026", "https://www.keishaforgovernor.com/klb-policy-careplan-1.pdf"], ["WTOC, Oct 20, 2026 (Bottoms on Pathways)", "https://wtoc.com/2026/10/20/bottoms-focuses-campaign-affordability-calls-data-center-pause"], ["AJC, Jul 31, 2026 (can she do it alone)", "https://www.ajc.com/politics/2026/07/bottoms-wants-to-expand-medicaid-in-georgia-but-can-she/"], ["Atlanta News First, Sep 8, 2026 (Jackson’s plan)", "https://www.atlantanewsfirst.com/2026/09/08/work-requirements-or-full-coverage-georgia-governor-hopefuls-roll-out-healthcare-proposals/"], ["GPB News, Oct 1, 2026 (work requirements)", "https://www.gpb.org/news/2026/10/01/medicaid-work-requirements-are-here-stay-no-matter-who-wins-georgia-governors-race"]] },

  { id: "tx", title: "Vouchers and public schools", issue: "Tax money for private schools", from: "James Talarico", race: "Texas US Senate", opp: "Ken Paxton", party: "Republican",
    screens: [
      ["The issue: vouchers", '<h2 class="h sm">Texas now pays for private school with tax dollars</h2><p class="lead">This year Texas started Education Freedom Accounts, usually called vouchers. Most private school students can get <b>$10,474</b> a year in state money.</p>' + stats([["274,000+", "families applied"], ["~118,000", "had awards as of August, with 121,000+ waitlisted"]]) + scale([["Awardees already in private school or homeschool", "70%", 70, GREY], ["Awardees from public school", "30%", 30, GREEN]]) + '<p class="lead muted">Any family can apply; kids with disabilities and lower-income families come first.</p>'],
      ["How Texas got here", '<h2 class="h sm">A fight that ran three years</h2><div class="ex"><b>2023</b>The Texas House stripped vouchers out of a bill.</div><div class="ex"><b>2024</b>Gov. Abbott and his allies spent millions in the primaries to replace more than a dozen anti-voucher Republicans.</div><div class="ex"><b>2025</b>The voucher law passed.</div><p class="lead">So most of the money is going to kids who were already in private school, and the fight is now moving to Washington.</p>'],
      ["Where Maya stands", '<h2 class="h sm">Maya fought vouchers and wants public money in public schools</h2>' + pts([["A former public school teacher.", ""], ["Against vouchers:", "she says they’re <q>taking tax dollars out of our public schools to subsidize private education.</q>"], ["Her record:", "in the Texas House she voted no on the 2025 law and tried to send it to a statewide vote. The House killed that, 86 to 62."], ["In the Senate:", "she’d fight efforts to take vouchers nationwide and oppose gutting the US Department of Education."]])]
    ],
    rows: [["On vouchers", "Against them: public money belongs in public schools", "For them. He says the program gives parents more say in their kids’ education"],
      ["Record", "Voted no in the Texas House and tried to send the law to a vote of the people", "As attorney general he vowed, <q>I promise to vigorously defend this law</q>"],
      ["In the Senate", "The program is Texas law, so a senator can’t cancel it. The Senate fight is over taking vouchers nationwide, which Maya would fight."]],
    winK: "Texas sends a senator who fights against vouchers going nationwide and wants public money in public schools.", winJ: "Texas sends a senator who backs vouchers and has vowed to defend the Texas program.",
    winNote: "Either way, a family’s voucher this year doesn’t depend on the Senate race.",
    anchor: '<span class="k">Maya</span>, a former public school teacher, <em>fought against vouchers</em> and wants <em>public money in public schools</em>. <span class="j">Her Republican opponent</span> <em>backs vouchers</em> and vowed to defend the law.',
    tests: [
      { q: "In one sentence: what’s the school issue in this race?", model: "Whether Texas tax dollars should pay for private school through vouchers, or stay in public schools.", ideas: [["Vouchers, paying for private school", /(voucher|private school)/], ["Public tax dollars", /(tax|public money|taxpayer|state money|dollar)/], ["Public schools", /public school/]], need: 2 },
      { q: "Where does Maya stand?", model: "Maya, a former public school teacher, fought vouchers in the Texas House and wants public money in public schools.", ideas: [["Against vouchers", /(against|oppos|fought|fight|stop|scam|voted no|vote against)[^.]{0,40}voucher|voucher[^.]{0,30}(scam|bad)/], ["Public money in public schools", /public (money|dollar|school)/], ["A former public school teacher", /(teacher|taught)/]], need: 2, must: [0] },
      { q: "Where does her Republican opponent stand?", model: "Her opponent backs the voucher program, says it gives parents more say, and vowed to defend the law.", ideas: [["Backs the voucher program", /(back|support|for|defend|like|want|pro)[^.]{0,30}voucher|voucher[^.]{0,40}(support|defend|back)/], ["Says it gives parents choice", /(parent|choice|choose)/], ["Vowed to defend the law", /defend/]], need: 1, must: [0] },
      { q: "If Maya wins instead of her opponent, what changes?", model: "Texas gets a senator who fights vouchers going nationwide and wants public money in public schools, instead of one who backs vouchers.", ideas: [["Maya fights vouchers going nationwide", /(nation|federal|washington|national|across the country|congress|senate)/], ["Maya: public money in public schools", /public (money|dollar|school)/], ["Her opponent: a senator who backs vouchers", /(opponent|republican|other|\bhe\b|\bhis\b)[^.]{0,60}voucher|voucher[^.]{0,60}(opponent|republican)/]], need: 2 },
      { q: "A volunteer says, “If Maya wins, your family’s voucher goes away.” What’s wrong?", model: "Vouchers are a Texas state law, and a US senator can’t cancel them. Maya would fight vouchers going nationwide.", ideas: [["Vouchers are a Texas state law", /(state|texas law|legislature|abbott|state program)/], ["A senator can’t cancel it", /(senat|federal|can'?t|cannot|not able|no power|won'?t)/]], need: 2 }
    ],
    right: /(voucher|public school|teacher|follow up|get back to you)/, wrong: /(take (away )?your voucher|cancel (your|the) voucher|voucher(s)? (will be|are) (gone|taken)|(paxton|opponent|republican)('s| is)? (a )?(crook|liar|lying)|close public schools)/,
    voters: [
      { name: "Rosa", meta: "Cafeteria manager, San Antonio", skin: "#c68e64", hair: "#2a1b14", style: "bob", shirt: "#b5523b", voice: ["Samantha", "Ava", "Google US English"], open: "Oh, you’re with Maya? I work in a school cafeteria, I’m for her. I just start at five in the morning, so I don’t know when I’ll vote.", follow: "What’s she actually going to do for schools like mine?", bye: "Okay, I’ll figure out a time before Tuesday. Thanks for coming by." },
      { name: "Wade", meta: "Rancher and school board, west Texas", skin: "#e2b48e", hair: "#6b5440", style: "cap", shirt: "#6e7f3c", voice: ["Fred", "Alex", "Daniel"], pitch: .9, rate: .95, open: "Afternoon. I’m on the school board out here, and I’ll be honest, I like the idea of choice. But we’re a small district. What does your candidate want to do?", follow: "So what happens to a district like ours if kids leave with vouchers?", bye: "Fair enough. I’ll be voting, I always do." },
      { name: "Kim", meta: "Mom of three, Frisco", skin: "#f1d1b5", hair: "#3a2a20", style: "bob", shirt: "#7a5c99", voice: ["Victoria", "Karen", "Allison"], open: "The Republican is fighting for parents. Why should my tax dollars only go to schools the government picks?", follow: "My kids deserve options. What’s wrong with that?", bye: "We’ll just disagree. Have a good day." },
      { name: "Darnell", meta: "Warehouse worker, Houston", skin: "#5a3a28", hair: "#0f0b09", style: "short", shirt: "#2f6b8f", voice: ["Tom", "Aaron", "Alex"], pitch: .95, rate: 1.05, open: "Hey, quick question. What’s she going to do about my electric bill?", follow: "Alright, and is she for the border wall or not?", bye: "Cool, I’ll vote. Thanks." }],
    key: "Talarico, a former public school teacher, fought vouchers in the Texas House: voted no on the 2025 law and offered an amendment to put it to a statewide vote, which the House killed 86 to 62. His site says vouchers are taking tax dollars out of public schools to subsidize private education. As senator he'd fight efforts to take vouchers nationwide, oppose gutting the US Department of Education and keep public money in public schools. Texas Education Freedom Accounts pay most private school students $10,474; 274,000+ applied; about 118,000 awards as of August; 121,000+ waitlisted; 70 percent of awardees were already in private school or homeschool. It's a state law; a senator can't cancel it. Paxton backs the program, says it gives parents more say, and vowed to vigorously defend the law. Anything else: offer the campaign follow-up.",
    sources: [["Talarico campaign, Public Education", "https://jamestalarico.com/issue/public-education/"], ["Texas Education Freedom Accounts, official site", "https://educationfreedom.texas.gov/"], ["KPRC, Aug 18, 2026 (who got awards)", "https://www.click2houston.com/news/local/2026/08/18/70-of-texas-voucher-awardees-previously-attended-private-school-or-were-homeschooled-state-data-shows/"], ["KWTX / Texas Tribune, Apr 16, 2025 (the vote)", "https://www.kwtx.com/2025/04/17/voucher-vote-updates-bid-send-voucher-plan-statewide-vote-is-defeated/"], ["Texas Tribune, May 3, 2025 (SB 2 signed)", "https://www.texastribune.org/2025/05/03/texas-school-vouchers-greg-abbott-signs"], ["Fox 7 Austin, Oct 21, 2026 (Talarico vs Paxton)", "https://fox7austin.com/news/talarico-vs-paxton-education"], ["Texas Attorney General release (defend the law)", "https://www.texasattorneygeneral.gov/news/releases/attorney-general-ken-paxton-celebrates-school-choice-texans-and-vows-defend-new-law"]] },

  { id: "oh", title: "Data centers and your electric bill", issue: "The cost of electricity", from: "Sherrod Brown", race: "Ohio US Senate", opp: "Sen. Jon Husted", party: "Republican, holds the seat",
    screens: [
      ["The issue: electric bills", '<h2 class="h sm">Bills up fast, data centers up faster</h2><p class="lead">Ohio families are paying more for power, while data centers, the buildings full of computers behind the internet and AI, keep multiplying.</p>' + stats([["13.5%", "rise in Ohio home electric bills in one year"], ["~50%", "more for electricity than six years ago"], ["9x", "growth in Ohio data centers since 2020"], ["#2", "Columbus’s rank among the fastest-growing data center markets"]]) + '<p class="lead">The fight is over who pays for all that new power: families or the data centers.</p>'],
      ["What Ohio remembers", '<h2 class="h sm">House Bill 6, the FirstEnergy bribery scandal</h2><p class="lead">A $1.3 billion power-company bailout passed with bribes, and a former Ohio House speaker is serving 20 years.</p><div class="ex"><b>Get this right</b>The bailout charge was repealed in 2021 before it was collected, and the coal charge ended in 2025, so experts say HB6 isn’t the main reason bills rose. Maya’s opponent was never charged.</div>'],
      ["Where Maya stands", '<h2 class="h sm">Maya wants data centers to pay their own power costs</h2>' + pts([["Make data centers pay", "the full cost of their power, so your bill doesn’t go up."], ["Cap rate hikes:", "limit how much utilities can raise your rates."], ["End their tax breaks.", ""], ["Let towns decide", "where data centers go. She hasn’t proposed banning them."]])]
    ],
    rows: [["Data centers’ power costs", "Require them to pay the full cost", "<q>If you create the cost, you should pay the cost.</q> His bill asks states to make them pay; adopting it is up to each state"],
      ["Rate hikes", "Cap them", "No cap proposed"],
      ["Tax breaks", "End them", "Says new data centers shouldn’t get them; as lieutenant governor he championed data center deals"],
      ["Who decides where they go", "Both say local communities should decide."]],
    winK: "Ohio sends a senator pushing to require data centers to pay their full power costs and to cap rate hikes.", winJ: "Ohio keeps a senator whose bill asks states to make data centers pay, with adoption left to each state.",
    winNote: "Her opponent holds the seat now.",
    anchor: '<span class="k">Maya</span> wants data centers to <em>pay their full power costs</em> and a <em>cap on rate hikes</em>. <span class="j">Her Republican opponent’s</span> bill asks states to make them pay, but <em>leaves it up to each state</em>.',
    tests: [
      { q: "In one sentence: what’s the electric bill issue in this race?", model: "Who pays for Ohio’s rising power costs: families or the data centers driving demand.", ideas: [["Electric bills are rising", /(bill|rate|electric|power|utilit)/], ["Data centers", /data cent/], ["Who pays", /(pay|cost|who)/]], need: 2, must: [1] },
      { q: "Where does Maya stand?", model: "Maya wants to require data centers to pay their full power costs, cap rate hikes and end their tax breaks.", ideas: [["Make data centers pay their full power costs", /data cent[^.]{0,60}(pay|cost)|(pay|cost)[^.]{0,60}data cent/], ["Cap how much rates can rise", /(cap|limit|stop)[^.]{0,30}(rate|bill|increase|hike|rise)/], ["End the tax breaks", /(tax break|tax credit|subsid)/]], need: 2 },
      { q: "Where does her Republican opponent stand?", model: "Her opponent says if you create the cost, you should pay it. His bill asks states to make data centers pay, but leaves adoption to each state.", ideas: [["If you create the cost, you pay it", /(create|pay)[^.]{0,30}cost|data cent[^.]{0,40}pay|should pay/], ["His bill leaves it up to each state", /(state|bill|act|optional|voluntar|up to)/], ["Local towns decide", /(local|town|communit)/]], need: 2 },
      { q: "If Maya wins instead of her opponent, what changes?", model: "Maya would push to require data centers to pay their full power costs and to cap rate hikes, instead of leaving it to each state.", ideas: [["Maya: require data centers to pay the full cost", /(require|full|make)[^.]{0,40}(data|pay|cost)|data cent[^.]{0,40}(pay|full)/], ["Maya: a cap on rate hikes", /(cap|limit)/], ["Her opponent: states decide whether to adopt it", /(state|up to|optional|voluntar)/]], need: 2 },
      { q: "A volunteer says, “Maya’s opponent was charged in the HB6 scandal, and HB6 is why your bill went up.” What’s wrong?", model: "Her opponent was never charged. And HB6’s bailout charge was repealed before it was collected, so experts say it isn’t the main reason bills rose.", ideas: [["Her opponent was never charged", /(never|not|wasn'?t|was not)[^.]{0,20}charg/], ["HB6 isn’t the main reason bills rose", /(repeal|not the main|isn'?t the (main|reason)|other reason|data cent|supply|ended|not why|no longer)/]], need: 2 }
    ],
    right: /(data cent|cap|rate|tax break|follow up|get back to you)/, wrong: /((husted|opponent|republican|\bhe\b) (was )?(charged|indicted|arrested)|hb ?6 is why|(wants to|will|going to|gonna) (shut|ban)|ban data cent|liar|lying)/,
    voters: [
      { name: "Denise", meta: "Retired bus driver, Lima", skin: "#d9a982", hair: "#b8b2aa", style: "bob", shirt: "#9a5b7d", voice: ["Samantha", "Victoria", "Allison"], open: "Oh, Maya Kaur! I’ve heard good things. I just haven’t figured out when I’m voting. My knees make that polling place a hassle.", follow: "And these electric bills, is she going to do anything about them?", bye: "Alright, I’ll get my daughter to drive me. Thank you, hon." },
      { name: "Kyle", meta: "Union electrician, New Albany", skin: "#e8c3a0", hair: "#5a4334", style: "cap", shirt: "#d0802f", voice: ["Alex", "Tom", "Aaron"], open: "I’m an electrician. I’ve been working data center jobs out by New Albany. If Maya makes them pay, does the work dry up?", follow: "So she’s not trying to shut them down?", bye: "Okay. I’ll think about it. I’ll be voting either way." },
      { name: "Pat", meta: "Homeowner, Lake County", skin: "#f0cfb0", hair: "#9a9a9a", style: "short", shirt: "#5a6f4f", voice: ["Fred", "Daniel", "Alex"], pitch: .9, rate: .95, open: "The senator’s already got a bill that makes data centers pay. Why would I switch?", follow: "So what’s the difference, then?", bye: "We’ll see. Have a good one." },
      { name: "Maria", meta: "Nurse, Toledo", skin: "#c99a74", hair: "#2a1b14", style: "puff", shirt: "#2f7f8f", voice: ["Ava", "Samantha", "Google US English"], open: "Hi! Quick one: what’s Maya going to do about the war?", follow: "Okay, and will she protect Medicaid? Half my patients are on it.", bye: "Got it. I’ll be voting, don’t worry." }],
    key: "Brown wants to require data centers to pay the full cost of their utilities so household bills don't go up, cap how much utilities can raise rates, end data center tax breaks, and let communities decide where data centers go. He has not proposed banning them and hasn't published details of the cap. Ohio home electric bills rose 13.5 percent in a year; data centers grew ninefold since 2020. Husted says if you create the cost, you should pay the cost; his Ratepayer Protection Act passed the House and asks states to consider making data centers pay, with adoption up to each state (Husted says it would require states). HB6 was a real bribery scandal; Husted was never charged; its nuclear charge was repealed in 2021 before collection and its coal charge ended in 2025, so it isn't the main reason bills rose. Husted holds the seat now. Anything else: offer the campaign follow-up.",
    sources: [["Brown campaign, Our Fight", "https://www.sherrodbrown.com/our-fight/"], ["Statehouse News Bureau, Oct 30, 2026 (13.5%)", "https://www.statenews.org/government-politics/2026-10-30/2026-race-for-u-s-senate-in-ohio-how-brown-husted-frame-affordability"], ["Boston Globe / NYT, Oct 23, 2026 (data center growth)", "https://www.bostonglobe.com/2026/10/23/business/midterm-voters-data-centers-energy-costs/"], ["PolitiFact, Jul 20, 2026 (HB6 and bills)", "https://politifact.com/factchecks/2026/jul/20/sherrod-brown/sherrod-brown-blames-hb-6-for-electric-bill-spike-experts-say-the-law-wasnt-the-main-cause/"], ["PolitiFact, Sep 23, 2026 (Husted and data centers)", "https://politifact.com/factchecks/2026/sep/23/sherrod-brown/jon-husted-pushed-for-data-centers-and-tax-incentives-in-ohio-as-sherrod-brown-ads-say/"], ["News 5 Cleveland, Sep 24, 2026 (both candidates)", "https://news5cleveland.com/news/local-news/data-centers-remain-a-flashpoint-in-ohios-u-s-senate-race"], ["Spectrum News, Sep 29, 2026 (Husted’s bill)", "https://spectrumnews1.com/ca/la/news/2026/09/29/husted-data-center-ratepayer-protection"], ["WOSU, Mar 31, 2026 (Householder sentence)", "https://www.wosu.org/2026-03-31/hung-jury-in-bribery-and-corruption-trial-of-former-firstenergy-executives-in-akron"]] },

  { id: "me", title: "Heating oil this winter", issue: "Heating your home this winter", from: "Troy Jackson", race: "Maine US Senate", opp: "Sen. Susan Collins", party: "Republican, holds the seat",
    screens: [
      ["The issue: heating costs", '<h2 class="h sm">Half of Maine heats with oil, and oil is near a record</h2>' + scale([["Maine homes that heat with oil", "~50%", 50, GREEN], ["US homes that heat with oil", "~3%", 3, GREY]]) + stats([["~$6", "a gallon this fall, near a record"], ["$1,650", "to fill a tank, up about 80% in a year"]]) + '<p class="lead">Reporting ties the spike to the war with Iran. For many families this winter, it’s heat or other bills.</p>'],
      ["Help that exists today", '<h2 class="h sm">Most worried voters can get help now</h2><div class="ex"><b>HEAP heating aid</b>Homeowners and renters can apply. A family of four can earn up to about $73,000. Applications run until funds run out or May 29, 2027.</div><div class="ex"><b>The oil reserve</b>Up to 315,000 barrels are being released. One analyst calls it a very small volume, and the state Chamber says it won’t land in home tanks right away.</div>'],
      ["Where Maya stands", '<h2 class="h sm">Maya would end the war driving prices and fund more heating aid</h2>' + pts([["End the war in Iran,", "which reporting ties to the price spike."], ["More money for heating aid", "through LIHEAP, the federal program behind HEAP."], ["Her record:", "as Maine Senate President in 2023, she helped pass $450 checks to more than 880,000 Mainers and $40 million more for heating aid."], ["On her opponent:", "her ad says her opponent is <q>funding this reckless war.</q>"]])]

  L[0].key = "Maya holds Bottoms's positions: end Georgia Pathways (about 20,000 enrolled against a first-year goal of 100,000; GAO found more spent on administration than care) and expand Medicaid to adults up to 138% of poverty, about $22,000 for one person; separate Rural Care First plan for rural hospitals; needs the legislature, day one she readies agencies. Federal law since 2025 adds work rules to expansion (80 hours, exemptions such as parents of kids 13 and under). About 200,000 or more poor Georgia adults are uninsured. The opponent (Rick Jackson) promises 'intelligent Medicaid expansion': a Pathways-style waiver with work requirements; no income limit or coverage number published. Anything else: offer the campaign follow-up.";
  L[1].key = "Maya holds Talarico's positions: a former public school teacher, voted no on SB 2 and offered a referendum amendment (tabled 86 to 62); calls vouchers scams that defund public schools; would fight vouchers going nationwide, protect the US Department of Education and special education oversight, hire teachers, raise pay, universal pre-K. Texas vouchers: $10,474 a year for most students; about 110,000 funded this fall; 7 in 10 awardees were already in private school or homeschool; cost projected to reach about $4.8 billion by 2030. The opponent (Paxton) vowed to vigorously defend the law and supports eliminating the US Department of Education. A senator can't cancel the Texas program. Anything else: offer the campaign follow-up.";
  L[2].key = "Maya holds Brown's positions: require data centers to pay the full cost of their own electricity, fight to cap rate hikes (no details), end data center tax breaks, let towns decide siting; no ban. Ohio bills averaged $89 a month in 2019 and $145 in January 2026; up 13.5% in a year; PJM's market monitor says data centers are the primary reason capacity costs jumped. HB6 was a bribery scandal; its charges ended, so it isn't why bills are up; the opponent backed HB6 but was never charged. The opponent (Husted) says if you create the cost you should pay the cost; his Ratepayer Protection Act asks states to consider rules, none must adopt; passed the House 417 to 3, stalled in the Senate. Anything else: offer the campaign follow-up.";
  L[3].key = "Maya holds Troy Jackson's positions: end the war in Iran and put more money into LIHEAP heating aid; in 2023 helped pass $450 checks to about 876,000 Mainers and $40 million for HEAP; no new dollar figure. About half of Maine homes heat with oil; $6.05 a gallon Oct 26, up about 80%; a 275-gallon fill about $1,660. HEAP: up to $38,070 single, $73,213 family of four, average benefit about $510; homeowners and renters; apply through May 29. The opponent (Collins) pushed for early aid ($36.7 million) and the reserve release (up to 315,000 barrels, two or three days of Northeast supply); voted five times against ending the war, then to end it since April 30. Anything else: offer the campaign follow-up.";
  L[4].key = "Maya holds El-Sayed's positions: not against tariffs per se, against dumb tariffs; wants targeted tariffs tied to an industrial plan with benchmarks for when they lift; unions at the table; opposes the Canada tariff fight. Tariffs are paid by US importers; most cost passes to US businesses and shoppers. Since Aug 22 a 50% tariff covers about $20 billion of Canadian goods (not cars; car parts face 25%, steel and aluminum 50%). Michigan auto parts jobs are down 4,000 in a year. The UAW endorsed Maya and backs targeted tariffs but rejects escalation on Canada. The opponent (Rogers) called tariffs necessary in September, said Oct 7 Canada is not our enemy and the tariff war should end, and says some tariffs helped. Don't cite $5,600 per household. Anything else: offer the campaign follow-up.";

  function scriptGrade() {
    var x = X(), mine = S.door.turns.filter(function (t) { return t.me; }).map(function (t) { return t.text; }), all = norm(mine.join(" . "));
    var wrong = x.wrong.test(all), right = x.right.test(all), long = mine.filter(function (t) { return t.split(/\s+/).length > 40; }).length, vote = /(vote|voting|ballot|polls|early|tuesday|plan)/.test(all);
    var G = {
      accurate: wrong ? { mark: "No", why: "Something you said doesn’t match Maya’s record." } : right ? { mark: "Yes", why: "What you said matches Maya’s positions." } : { mark: "Partly", why: "Nothing wrong, but you didn’t say where Maya stands." },
      short: long === 0 ? { mark: "Yes", why: "Each answer stayed short." } : long === 1 ? { mark: "Partly", why: "One answer ran long." } : { mark: "No", why: "Your answers ran long." },
      vote: vote ? { mark: "Yes", why: "You came back to the plan to vote." } : { mark: "No", why: "You didn’t ask about their plan to vote." }
    };
    G.tip = wrong ? "Stick to the line you learned in the lesson." : !right ? "Give Maya’s position in one sentence before you ask." : !vote ? "End every answer with a question like “When are you planning to vote?”" : long ? "Two sentences is plenty at a door." : "That’s a door a field director would be happy with.";
    return G;
  }

  /* ---------- events ---------- */
  function currentR() {
    if (S.lesson == null) return null;
    if (S.ph === 1 && S.idx < X().tests.length) { S.t[S.idx] = S.t[S.idx] || {}; return S.t[S.idx]; }
    if (S.ph === 2 && S.idx === 0 && S.door) return S.door.r;
    return null;
  }
  function onSaid(text) { if (S.ph === 1) gradeTest(S.idx, text); else if (S.ph === 2) said(text); }
  document.addEventListener("click", function (e) {
    if (e.target.closest("a")) return;
    var stEl = e.target.closest("#story.tap");
    if (stEl && !e.target.closest("button")) { var rc = stEl.getBoundingClientRect(); step((e.clientX - rc.left) < rc.width * 0.3 ? -1 : 1); return; }
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.seg) { var sp = t.dataset.seg.split(","); var ph = +sp[0], ix = +sp[1]; if (ph === 2 && ix === 0) { if (S.ph === 2 && S.door) goStep(2, 0); else startDoor(); return; } if (ph === 2 && ix === 1 && !S.door) { startDoor(); return; } goStep(ph, ix); return; }
    if (t.dataset.lesson != null) { S.lesson = +t.dataset.lesson; S.t = {}; S.door = null; goStep(0, 0); return; }
    var r;
    switch (t.id) {
      case "stnext": step(1); break;
      case "qnext": step(1); break;
      case "home": home(); break;
      case "finish": goStep(2, 1); break;
      case "startdoor": startDoor(); break;
      case "srcs": S.sources = true; render(); $("body").scrollTop = 0; break;
      case "srcback": S.sources = false; render(); break;
      case "hearanchor": speak(X().anchor, COACH); break;
      case "hearvoter": var lv = S.door.turns.filter(function (q) { return !q.me; }).slice(-1)[0]; if (lv) speak(lv.text, X().voters[S.voter]); break;
      case "mic": r = currentR(); if (!r) break; if (r.listening) { if (recSession) recSession.cancel(); try { if (rec) rec.stop(); } catch (er) {} rec = null; recSession = null; r.listening = false; render(); } else listen(r, onSaid); break;
      case "mic2": r = currentR(); finishListening(r, onSaid); break;
      case "micretry": r = currentR(); if (r) { r.error = ""; listen(r, onSaid); } break;
      case "typed": r = currentR(); var ta = $("said"), txt = ta ? ta.value.trim() : ""; if (r && txt) { r.text = txt; onSaid(txt); } break;
      case "retry": S.t[S.idx] = {}; render(); break;
    }
  });

  render();
  if (IN_CLAUDE && claude.use) claude.use("sample").then(function (s) { sample = s; }).catch(function () { sample = null; });
})();
</script>
