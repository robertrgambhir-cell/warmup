<style>
  /* version 130 (Robert, Oct 31): Maya Kaur's issue lessons (issues/, built separately) open over the app from the Learn tab, so the app keeps its place */
  .camp-tile { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; width: 100%; text-align: left; margin: 0 0 14px; padding: 12px 14px; border-radius: 20px; border: 0; cursor: pointer; color: #fff; background: linear-gradient(160deg,#2a5fae 0%,#1F4C91 55%,#173b74 100%); font: inherit; }
  .camp-tile img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,.85); }
  .camp-tile .ct-main { display: grid; gap: 2px; }
  .camp-tile b { font-family: var(--head-font); font-weight: var(--head-weight); font-size: 18px; line-height: 1.2; }
  .camp-tile small { font-size: 12.5px; opacity: .82; line-height: 1.3; }
  .camp-tile .ct-k { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; opacity: .75; }
  .camp-tile .go { font-size: 24px; opacity: .8; }
  .device { position: relative; }
  .issues-ov { position: absolute; inset: 10px; z-index: 60; border-radius: 40px; overflow: hidden; background: #FCF8F2; animation: issuesIn .32s cubic-bezier(.2,.8,.2,1); }
  .issues-ov iframe { display: block; width: 100%; height: 100%; border: 0; }
  @keyframes issuesIn { from { transform: translateY(24px); opacity: 0; } }
  @media (max-width: 520px) { .issues-ov { inset: 0; border-radius: 0; } }
  @media (prefers-reduced-motion: reduce) { .issues-ov { animation: none; } }
</style>
<script>
/* version 130: open and close the issue lessons over the app */
function issuesOpen() {
  if (document.getElementById("issues-ov")) return;
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) { /* ignore */ }
  var host = document.getElementById("device") || document.body, ov = document.createElement("div");
  ov.className = "issues-ov"; ov.id = "issues-ov";
  ov.innerHTML = '<iframe src="issues/?all" title="Maya Kaur’s issue lessons" allow="microphone; autoplay"></iframe>';
  host.appendChild(ov);
}
window.addEventListener("message", function (e) { if (e && e.data && e.data.warmup === "issues-close") { var ov = document.getElementById("issues-ov"); if (ov) ov.remove(); } });
</script>
