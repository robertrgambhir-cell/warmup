<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health insurance brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Georgia's Learn in the look Robert picked (A/B rounds 1 and 2, Nov 1): Duolingo's lesson screen, the segmented story bar, no photo row.
     Every size below scales with --k, which the page sets so each screen's content fills its height exactly (no blank bands, no scrolling).
     Rules: claude/campaign-demos/lesson-playbook.md. */
  :root {
    --sans: "Figtree", system-ui, sans-serif; --serif: "Newsreader", Georgia, serif;
    --ink: #3c3c3c; --body: #4b4b4b; --muted: #5a5a5a; --line: #e5e5e5; --panel: #f4f6f8;
    --green: #35b57c; --green-deep: #1b7a4d; --red: #b3261e; --page: #ece7df; --k: 1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); font-family: var(--sans); color: var(--ink); }
  .wrap { min-height: 100svh; display: flex; justify-content: center; align-items: center; padding: 16px; }
  .phone { position: relative; width: min(402px, 100%); height: clamp(520px, calc(100svh - 32px), 800px); background: #fff; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; padding: 14px 18px 20px; box-shadow: 0 18px 48px -24px rgba(40,30,10,.35); border: 1px solid rgba(0,0,0,.06); }
  @media (max-width: 500px) { .wrap { padding: 0; } .phone { width: 100%; height: 100svh; border-radius: 0; border: 0; padding: max(14px, env(safe-area-inset-top)) 18px max(20px, env(safe-area-inset-bottom)); } }
  .tag { position: absolute; right: 12px; bottom: 5px; font: 600 11px/1 var(--sans); color: rgba(38,35,32,.45); }
  .sup { font: 700 .55em/0 var(--sans); vertical-align: .9em; margin-left: 1px; }

  /* the story bar: one segment per screen, full once you reach it, empty until then (Instagram; Robert, Nov 1, 2:11 PM) */
  .top { display: flex; align-items: center; gap: 14px; height: 26px; flex: none; }
  .x { border: 0; background: none; padding: 0; width: 22px; height: 22px; color: #afafaf; cursor: pointer; font-family: inherit; }
  .seg { display: flex; gap: 4px; flex: 1; }
  .seg i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); }
  .seg i.full, .seg i.cur { background: var(--green); }

  .body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; padding-top: calc(14px * var(--k)); gap: calc(16px * var(--k)); cursor: default; }
  .body > * { flex: none; }
  h2 { margin: 0; font: 800 calc(24px * var(--k))/1.2 var(--sans); letter-spacing: -.01em; text-wrap: balance; color: var(--ink); }
  .body p { margin: 0; font: 500 calc(16.5px * var(--k))/1.45 var(--sans); color: var(--body); }
  .pic { display: flex; flex-direction: column; justify-content: center; border-radius: 18px; padding: calc(14px * var(--k)) 12px; background: var(--panel); }
  .pic.plain { background: transparent; padding: 0; }

  /* the bottom row: the main button takes most of the width, Sources sits beside it (Robert, Nov 1, 2:11 PM) */
  .foot { flex: none; display: flex; gap: 10px; margin-top: 14px; }
  .src { flex: none; align-self: stretch; min-height: 54px; padding: 0 11px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; border-radius: 16px; font: 800 13px/1 var(--sans); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .src svg { width: 16px; height: 16px; }
  .next { flex: 1; min-width: 0; border: 0; border-radius: 16px; min-height: 54px; padding: 6px 12px 8px; white-space: normal; text-wrap: balance; background: var(--green); color: #fff; font: 800 15.5px/1.2 var(--sans); box-shadow: 0 4px 0 var(--green-deep); cursor: pointer; }
  .next:active { transform: translateY(4px); box-shadow: none; }
  .next:focus-visible, .src:focus-visible, .x:focus-visible { outline: 3px solid #1F4C91; outline-offset: 2px; }

  svg .t { font: 600 12.5px var(--sans); fill: var(--muted); }
  svg .t.g { fill: var(--green-deep); font-weight: 800; }
  svg .t.m { font-size: 13.5px; fill: #6f7d8c; }
  .pic > svg.wide { display: block; width: 100%; height: auto; max-height: calc(260px * var(--k)); }

  /* three sisters (GA 2, GA 7): one column per person, each over her name */
  .sis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 4px; text-align: center; }
  .sis .c { display: flex; flex-direction: column; align-items: center; }
  .sis svg { display: block; width: 100%; height: auto; max-height: calc(185px * var(--k)); border-bottom: 2px solid rgba(38,35,32,.16); overflow: visible; }
  .sis b { display: block; margin-top: 6px; font: 800 calc(16px * var(--k))/1.2 var(--sans); color: var(--ink); }
  .sis span { display: block; white-space: nowrap; font: 500 calc(13.5px * var(--k))/1.3 var(--sans); color: var(--muted); }
  .sis em { display: block; font: 600 calc(13.5px * var(--k))/1.25 var(--sans); font-style: normal; color: var(--green-deep); margin-top: 2px; }
  .sis .bri b, .sis .bri em { color: var(--red); }
  .sis .bri.now b { color: var(--ink); }
  .sis .bri.now em { color: var(--green-deep); font-weight: 800; }

  /* GA 3: people counted in figures */
  .count { display: flex; flex-direction: column; gap: calc(12px * var(--k)); }
  .count .row { display: flex; flex-direction: column; gap: 6px; }
  .count .lab { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .count .lab b { font: 800 calc(20px * var(--k))/1.1 var(--sans); }
  .count .lab b.r { color: var(--red); }
  .count .lab span { font: 500 calc(14.5px * var(--k))/1.2 var(--sans); color: var(--muted); }
  .count .ppl { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px 9px; width: min(100%, calc(320px * var(--k))); }
  .count .ppl svg { width: 100%; height: auto; display: block; }
  .count small { font: 500 calc(13px * var(--k))/1 var(--sans); color: var(--muted); }
  .bri-mini { width: calc(40px * var(--k)); height: calc(66px * var(--k)); flex: none; margin-right: 2px; }

  /* GA 4: 51 tiles, the 41 that accepted first */
  .states { display: flex; flex-direction: column; gap: calc(10px * var(--k)); }
  .tiles { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 5px; width: min(100%, calc(320px * var(--k))); align-self: center; }
  .tiles i { aspect-ratio: 1 / 1; border-radius: 6px; display: grid; place-items: center; font: 700 calc(11.5px * var(--k))/1 var(--sans); font-style: normal; color: #fff; background: var(--green); }
  .tiles i.n { background: #c9cdd3; color: #4b4b4b; }
  .tiles i.ga { background: #fff; color: var(--red); box-shadow: inset 0 0 0 2.5px var(--red); font-weight: 800; }
  .key { display: flex; gap: 8px 16px; flex-wrap: wrap; font: 600 calc(13.5px * var(--k))/1.1 var(--sans); color: var(--muted); }
  .key span { display: inline-flex; align-items: center; gap: 6px; }
  .key i { width: 12px; height: 12px; border-radius: 4px; background: var(--green); }
  .key i.n { background: #c9cdd3; }
  .key i.ga { background: #fff; box-shadow: inset 0 0 0 2px var(--red); }

  /* GA 5: the condition */
  .cond { display: flex; flex-direction: column; gap: 8px; }
  .cond svg { display: block; width: 100%; height: auto; max-height: calc(200px * var(--k)); }
  .cond .caps { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: center; font: 600 calc(14px * var(--k))/1.3 var(--sans); color: var(--muted); }
  .cond .caps span:last-child { color: var(--green-deep); }

  /* GA 6: the clipping and the bars */
  .news { margin: 2px 4px; display: flex; flex-direction: column; gap: 6px; padding: calc(14px * var(--k)) 16px calc(12px * var(--k)); background: #fffdf8; border: 1px solid #e4ddcf; border-radius: 6px; box-shadow: 0 6px 16px -10px rgba(60,40,10,.35); transform: rotate(-1deg); text-decoration: none; color: #1d1c1a; }
  .nw-o { font: 600 12.5px/1 var(--serif); font-style: italic; color: #5b554d; text-transform: none; letter-spacing: 0; }
  .nw-h { font: 600 calc(21px * var(--k))/1.2 var(--serif); }
  .nw-d { font: 500 12px/1 var(--sans); color: #7a736a; }
  .bars { display: flex; flex-direction: column; gap: calc(12px * var(--k)); margin-top: calc(16px * var(--k)); }
  .bars .b { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 10px; row-gap: 4px; align-items: center; }
  .bars .b span { grid-column: 1 / -1; font: 600 calc(14px * var(--k))/1.2 var(--sans); color: var(--muted); }
  .bars .t { height: calc(22px * var(--k)); border-radius: 13px; }
  .bars .t i { display: block; height: 100%; border-radius: 13px; }
  .bars .t i.exp { width: 100%; border: 2px dashed #a7a29a; }
  .bars .t i.got { width: 18.5%; background: var(--green); }
  .bars b { font: 800 calc(20px * var(--k))/1 var(--sans); min-width: 76px; text-align: right; }
  .bars b.g { color: var(--green-deep); }

  /* sources sheet */
  .sheet { position: absolute; inset: 0; background: rgba(0,0,0,.28); display: none; align-items: flex-end; z-index: 4; }
  .sheet.on { display: flex; }
  .sheet .card { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 18px 20px 28px; max-height: 80%; overflow: auto; }
  .sheet h3 { margin: 0; font: 800 19px/1.2 var(--sans); }
  .sheet .note { margin: 4px 0 12px; font: 500 13.5px/1.3 var(--sans); color: var(--muted); white-space: nowrap; }
  .sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font: 500 14.5px/1.35 var(--sans); color: var(--body); }
  .sheet .close { margin-top: 16px; width: 100%; height: 46px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: #fff; font: 800 15px/1 var(--sans); color: var(--ink); cursor: pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone">
    <div class="top"><button class="x" type="button" aria-label="Close lesson" id="restart"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button><div class="seg" id="seg"></div></div>
    <div class="body" id="body"></div>
    <div class="foot"><button class="src" type="button" id="src">Sources</button><button class="next" type="button" id="next"></button></div>
    <span class="tag" id="tag"></span>
    <div class="sheet" id="sheet"><div class="card"><h3>Sources</h3><p class="note">Clickable links come at the end of the lesson</p><ol id="srclist"></ol><button class="close" type="button" id="closesrc">Back to the lesson</button></div></div>
  </div>
</div>
<script>
(function () {
  var S = /*SCREENS*/[];
  var NONUM = /[?&]nonum\b/.test(location.search);
  var m = /[?&]n=(\d)/.exec(location.search), i = m ? Math.min(S.length, Math.max(1, +m[1])) - 1 : 0;
  var $ = function (id) { return document.getElementById(id); };
  function render() {
    var s = S[i];
    $("seg").innerHTML = S.map(function (_, k) { return '<i class="' + (k < i ? "full" : k === i ? "cur" : "") + '"></i>'; }).join("");
    $("body").innerHTML = '<h2>' + s.h + '</h2><div class="pic' + (s.fit ? ' fit' : '') + '">' + s.pic + '</div>' + (s.p ? '<p>' + s.p + '</p>' : '');
    fit();
    $("next").textContent = s.btn;
    $("tag").textContent = NONUM ? "" : "GA " + (i + 1);
    $("srclist").innerHTML = s.src.map(function (r) { return '<li>' + r[0] + '</li>'; }).join("");
    $("sheet").classList.remove("on");
    try { history.replaceState(null, "", "?n=" + (i + 1) + (NONUM ? "&nonum" : "")); } catch (e) {}
  }
  function fit() {
    var b = $("body"), ph = $("phone"), ok = function (k) { ph.style.setProperty("--k", k); return b.lastElementChild.getBoundingClientRect().bottom <= b.getBoundingClientRect().bottom - 2; };
    var lo = 0.6, hi = 1.5; if (ok(hi)) lo = hi; else for (var j = 0; j < 10; j++) { var m = (lo + hi) / 2; if (ok(m)) lo = m; else hi = m; }
    ph.style.setProperty("--k", lo.toFixed(3));
  }
  window.addEventListener("resize", function () { fit(); });
  function go(d) { i = (i + d + S.length) % S.length; render(); }
  $("next").addEventListener("click", function () { go(1); });
  $("restart").addEventListener("click", function () { i = 0; render(); });
  $("closesrc").addEventListener("click", function () { $("sheet").classList.remove("on"); });
  $("src").addEventListener("click", function () { $("sheet").classList.add("on"); });
  $("body").addEventListener("click", function (e) {
    var r = $("body").getBoundingClientRect();
    if (e.clientX - r.left < r.width * 0.25 && i > 0) go(-1);
  });
  document.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") go(1); if (e.key === "ArrowLeft" && i > 0) go(-1); if (e.key === "Escape") $("sheet").classList.remove("on"); });
  render();
})();
</script>
</body>
</html>
