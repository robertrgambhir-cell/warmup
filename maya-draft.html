<title>Maya's Georgia Briefing</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one phone-sized app; on a laptop it sits in a phone frame, on a phone it fills the screen. A printed campaign briefing, not a game. */
:root{
  --paper:#F6F6F3; --ink:#14171F; --ink2:#4E5563; --ink3:#868C99; --rule:#DCDEE3;
  --maya:#1F4C91; --maya-soft:#E7EDF6; --gap:#C23B2E; --gap-soft:#F7E3E0; --go:#2E7A55; --go-soft:#E2F0E8;
  --clip:#FFFFFF; --stage:#0E1014;
  --serif:"Newsreader",Georgia,"Times New Roman",serif; --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--stage);color:var(--ink);font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--maya);outline-offset:2px}
.phone{width:100%;height:100%;background:var(--paper);position:relative;overflow:hidden;container-type:size;display:flex;flex-direction:column}
@media (min-width:600px) and (min-height:700px){
  .phone{width:400px;height:min(820px,calc(100% - 40px));border-radius:44px;box-shadow:0 0 0 10px #050608,0 30px 80px rgba(0,0,0,.5)}
}
/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:max(14px,4cqh) 20px 0}
.top img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.top .who{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.top .who b{font-size:14px;font-weight:600}
.top .who span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.top .x{margin-left:auto;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.top .x:hover{background:var(--rule)}
/* stepper */
.step{display:flex;align-items:center;gap:8px;padding:12px 20px 0;min-height:30px}
.bars{display:flex;gap:4px;flex:1}
.bars i{flex:1;height:3px;border-radius:2px;background:var(--rule);position:relative;overflow:hidden}
.bars i.done{background:var(--ink)}
.bars i.now::after{content:"";position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(.5)}
.lchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--go);background:var(--go-soft);padding:4px 9px;border-radius:99px;white-space:nowrap}
.pname{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);padding:6px 20px 0;display:flex;justify-content:space-between}
/* body */
.body{flex:1;min-height:0;display:flex;flex-direction:column;padding:2.4cqh 22px 0;overflow:hidden}
.eyebrow{font-family:var(--mono);font-size:max(10.5px,1.45cqh);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin:0 0 1.2cqh}
h1,h2{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;text-wrap:balance;margin:0}
h1{font-size:max(28px,4.6cqh);line-height:1.08}
h2{font-size:max(25px,3.85cqh);line-height:1.1}
h2 em{font-style:normal;color:var(--gap)}
h2 .m{color:var(--maya)}
p{margin:0}
.lede{font-size:max(15.5px,2.15cqh);line-height:1.42;color:var(--ink2);margin-top:1.6cqh}
.lede b{color:var(--ink);font-weight:600}
.small{font-size:max(13.5px,1.85cqh);line-height:1.4;color:var(--ink2)}
.grow{display:flex;flex-direction:column}
.inner{display:flex;flex-direction:column;transform-origin:top left}
sup.s{font-family:var(--mono);font-size:.55em;color:var(--ink3);margin-left:1px}
/* footer */
.foot{padding:1.6cqh 22px max(18px,3cqh);display:flex;flex-direction:column;gap:10px}
.srcbtn{align-self:flex-start;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);border-bottom:1px solid var(--rule);padding:2px 0}
.srcbtn:hover{color:var(--ink)}
.cta{width:100%;min-height:54px;border-radius:14px;background:var(--ink);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;text-align:center}
.cta:hover{background:#262a35}
.cta.go{background:var(--go)}
.cta.go:hover{background:#246346}
.cta[disabled]{opacity:.45;cursor:default}
.link{font-size:14px;font-weight:600;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;align-self:center}
/* sheet */
.scrim{position:absolute;inset:0;background:rgba(14,16,20,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--paper);width:100%;border-radius:20px 20px 0 0;padding:20px 22px 26px;max-height:80%;overflow:auto}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 6px}
.sheet ol{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.sheet li{display:flex;gap:10px;font-size:14.5px;line-height:1.35}
.sheet li i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink3);min-width:16px;padding-top:2px}
.sheet a{color:var(--maya)}
.sheet .cta{margin-top:18px}
.toast{position:absolute;left:22px;right:22px;bottom:96px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;font-size:14px;z-index:30;line-height:1.35}

/* home */
.hm-brief{display:flex;gap:12px;align-items:center;margin:2.2cqh 0 0;padding:1.6cqh 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.hm-brief img{width:44px;height:44px;border-radius:50%;object-fit:cover}
.hm-brief p{font-family:var(--serif);font-size:max(15.5px,2.05cqh);line-height:1.35;font-style:italic;color:var(--ink2)}
.today{margin-top:2.2cqh;background:var(--ink);color:#fff;border-radius:16px;padding:2.2cqh 18px;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.today:hover{background:#262a35}
.today .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#9ec3a9;display:flex;justify-content:space-between}
.today b{font-family:var(--serif);font-weight:500;font-size:max(24px,3.4cqh);line-height:1.1}
.today span{font-size:14.5px;color:#C9CDD6;line-height:1.35}
.next{margin-top:1.8cqh;display:flex;flex-direction:column}
.next .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.nrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:1.15cqh 0;border-bottom:1px solid var(--rule);text-align:left;width:100%}
.nrow b{font-weight:600;font-size:max(15px,2cqh)}
.nrow small{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.nrow span{grid-column:1/-1;font-size:13.5px;color:var(--ink2)}
/* how */
.how{display:flex;flex-direction:column;gap:0;margin-top:3cqh}
.how .part{display:grid;grid-template-columns:auto 1fr auto;gap:4px 14px;padding:2.4cqh 0;border-top:1px solid var(--rule)}
.how .part:last-child{border-bottom:1px solid var(--rule)}
.how .n{font-family:var(--serif);font-size:max(34px,5cqh);line-height:.9;color:var(--maya);grid-row:1/3}
.how b{font-size:max(18px,2.5cqh);font-weight:600}
.how em{font-style:normal;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink3);align-self:center}
.how span{grid-column:2/4;font-size:max(14.5px,1.95cqh);line-height:1.4;color:var(--ink2)}
.how ul{grid-column:2/4;margin:4px 0 0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.how li{font-size:12.5px;font-weight:600;background:var(--maya-soft);color:var(--maya);padding:4px 9px;border-radius:99px}
/* cover */
.three{list-style:none;margin:3cqh 0 0;padding:0;display:flex;flex-direction:column}
.three li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:2cqh 0;border-top:1px solid var(--rule);font-size:max(17px,2.4cqh);line-height:1.3;font-weight:500}
.three li:last-child{border-bottom:1px solid var(--rule)}
.three li i{font-style:normal;font-family:var(--serif);font-size:max(22px,3cqh);color:var(--maya);line-height:1}
.three li small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:3px}
/* lanes: how people get insurance */
.lanes{display:flex;flex-direction:column;gap:1.3cqh;margin-top:2.6cqh}
.lane{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center}
.lane .ic{width:max(40px,5.2cqh);height:max(40px,5.2cqh);border-radius:12px;display:grid;place-items:center;grid-row:1/3}
.lane .ic svg{width:55%;height:55%}
.lane b{font-size:max(16px,2.15cqh);font-weight:600}
.lane span{font-size:max(13.5px,1.8cqh);color:var(--ink2);line-height:1.3}
.lane.med .ic{background:var(--maya);color:#fff}
.lane .ic{background:#E9EAEE;color:var(--ink2)}
/* big number */
.big{font-family:var(--serif);font-size:max(64px,10cqh);line-height:.95;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.big small{font-size:.32em;color:var(--ink2);letter-spacing:0;margin-left:6px}
/* income line */
.inc{margin-top:3cqh;position:relative}
.inc .track{display:flex;height:max(46px,6.2cqh);border-radius:10px;overflow:hidden;font-size:12px;font-weight:600}
.inc .z{overflow:hidden;white-space:nowrap;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 6px;line-height:1.15}
.inc .z1{flex:0 0 20%;background:var(--maya-soft);color:var(--maya)}
.inc .z2{flex:0 0 42%;background:var(--gap);color:#fff}
.inc .z3{flex:1;background:#E3E6EA;color:var(--ink2)}
.inc .ax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:5px;position:relative;height:14px}
.inc .ax span{position:absolute;transform:translateX(-50%)}
.sis{position:relative;height:max(92px,13cqh)}
.sis .p{position:absolute;bottom:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;width:90px}
.sis .p svg{width:max(28px,4cqh);height:max(34px,4.8cqh);color:#9097A3}
.sis .p b{font-size:14px;font-weight:600}
.sis .p small{font-size:12px;color:var(--ink2);line-height:1.2}
.sis .p.bri svg{color:var(--gap)}
.sis .p.bri b{color:var(--gap)}
.sis .p.bri::before{content:"";position:absolute;inset:-6px -2px -4px;border:2px solid var(--gap);border-radius:12px;z-index:-1}
.inc.ex .z1{flex-basis:62%}
.inc.ex .z2{flex-basis:0;padding:0}
.inc .z1,.inc .z2{transition:flex-basis .9s cubic-bezier(.2,.8,.2,1)}
/* compare bars */
.cmp{display:flex;flex-direction:column;gap:1.2cqh;margin-top:2.4cqh}
.cmp .r{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;font-size:14px}
.cmp .t{height:max(30px,4cqh);background:transparent;border-radius:8px;position:relative}
.cmp .t i{position:absolute;inset:0 auto 0 0;border-radius:8px;display:flex;align-items:center;justify-content:flex-end;padding-right:10px;color:#fff;font-style:normal;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
/* states */
.st-pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:2.6cqh;align-items:start}
.st-pair .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px}
.st-pair .bign{font-family:var(--serif);font-size:max(48px,7.4cqh);line-height:1;color:var(--maya)}
.st-pair .bign.no{color:var(--gap)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.chips span{font-size:12.5px;font-weight:600;padding:3px 7px;border-radius:6px;background:#ECEDF0;color:var(--ink2)}
.chips span.ga{background:var(--gap);color:#fff}
/* steelman */
.facts{margin-top:2.4cqh;display:flex;flex-direction:column}
.facts div{display:grid;grid-template-columns:86px 1fr;gap:12px;padding:1.5cqh 0;border-top:1px solid var(--rule);font-size:max(14.5px,1.95cqh);line-height:1.35}
.facts div:last-child{border-bottom:1px solid var(--rule)}
.facts small{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);padding-top:3px}
.quote{font-family:var(--serif);font-style:italic;font-size:max(18px,2.5cqh);line-height:1.3;margin-top:2.2cqh;padding-left:14px;border-left:2px solid var(--ink)}
.quote small{display:block;font-family:var(--sans);font-style:normal;font-size:12.5px;color:var(--ink3);margin-top:6px}
/* news */
.clips{display:flex;flex-direction:column;gap:1.6cqh;margin-top:2.4cqh}
.clip{background:var(--clip);border:1px solid var(--rule);padding:1.8cqh 16px;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.04),0 8px 20px -14px rgba(0,0,0,.35)}
.clip:nth-child(1){transform:rotate(-.6deg)}
.clip:nth-child(2){transform:rotate(.5deg)}
.clip .o{font-family:var(--serif);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--rule);padding-bottom:6px;display:block}
.clip .h{font-family:var(--serif);font-weight:600;font-size:max(18.5px,2.55cqh);line-height:1.16;margin:8px 0 6px;display:block}
.clip .d{font-size:12px;color:var(--ink3)}
.stat{display:flex;gap:18px;margin-top:2.4cqh;align-items:baseline}
.stat div{display:flex;flex-direction:column}
.stat b{font-family:var(--serif);font-weight:500;font-size:max(30px,4.4cqh);line-height:1}
.stat b.hot{color:var(--gap)}
.stat span{font-size:12.5px;color:var(--ink2);margin-top:4px}
/* stance */
.plan{margin-top:2.4cqh;display:flex;flex-direction:column}
.plan .row{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:1.8cqh 0;border-top:1px solid var(--rule)}
.plan .row:last-child{border-bottom:1px solid var(--rule)}
.plan i{font-style:normal;font-family:var(--serif);font-size:max(22px,3cqh);color:var(--maya);line-height:1}
.plan b{font-size:max(16.5px,2.25cqh);font-weight:600;display:block}
.plan span{font-size:max(13.5px,1.85cqh);color:var(--ink2);line-height:1.35;display:block;margin-top:3px}
.then{margin-top:1.8cqh;display:flex;gap:10px;align-items:flex-start;font-size:max(14px,1.9cqh);color:var(--ink2);line-height:1.4}
.then svg{flex:0 0 auto;margin-top:2px;color:var(--maya)}
/* two outcomes */
.fork2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:2.6cqh}
.fork2 > div{border-radius:14px;padding:1.8cqh 14px;display:flex;flex-direction:column;gap:6px}
.fork2 .a{background:var(--maya);color:#fff}
.fork2 .b{background:#E9EAEE}
.fork2 small{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.fork2 b{font-family:var(--serif);font-weight:500;font-size:max(19px,2.6cqh);line-height:1.15}
.fork2 span{font-size:13px;line-height:1.35;opacity:.85}
.power{margin-top:2.2cqh;padding:1.6cqh 14px;background:var(--maya-soft);border-radius:12px;font-size:max(14px,1.9cqh);line-height:1.4;color:var(--ink)}
/* practice intro */
.pintro .lede{margin-top:2cqh}
.steps4{list-style:none;margin:3cqh 0 0;padding:0;display:flex;flex-direction:column}
.steps4 li{display:grid;grid-template-columns:24px 1fr;gap:12px;padding:1.4cqh 0;border-top:1px solid var(--rule);font-size:max(15px,2cqh)}
.steps4 li:last-child{border-bottom:1px solid var(--rule)}
.steps4 i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--ink3);padding-top:3px}
.steps4 b{font-weight:600}
.steps4 span{color:var(--ink2)}
/* thread */
.scene{display:flex;align-items:center;gap:12px;padding:1.2cqh 0 1.4cqh;border-bottom:1px solid var(--rule)}
.av{width:44px;height:44px;border-radius:50%;flex:0 0 auto;overflow:hidden;background:#E8DCCB}
.scene b{font-size:15px;font-weight:600;display:block}
.scene span{font-size:12.5px;color:var(--ink3)}
.pin{margin-top:1cqh;font-size:12.5px;color:var(--ink2);background:var(--maya-soft);border-radius:10px;padding:8px 12px;line-height:1.4}
.pin b{color:var(--maya)}
.thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:1.6cqh 0 6px;scroll-behavior:smooth}
.note{align-self:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);text-align:center;padding:2px 10px}
.msg{max-width:84%;padding:10px 13px;border-radius:16px;font-size:15px;line-height:1.38;animation:pop .28s ease-out both}
.msg.v{align-self:flex-start;background:#ECEDF0;border-bottom-left-radius:5px}
.msg.c{align-self:flex-start;background:var(--maya-soft);border-bottom-left-radius:5px}
.msg.c::before{content:"Canvasser";display:block;font-size:11px;font-weight:700;color:var(--maya);margin-bottom:2px}
.msg.c.wrong{background:var(--gap-soft)}
.msg.c.wrong::before{color:var(--gap)}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.msg.me.live{background:#fff;color:var(--ink);border:1.5px solid var(--go);display:flex;gap:10px;align-items:flex-start;max-width:92%}
.msg .lm{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;position:relative}
.msg .lm::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--go);opacity:.35;animation:ring 1.4s ease-out infinite}
.wave{display:flex;gap:3px;align-items:center;height:12px;margin-bottom:4px}
.wave i{width:3px;height:4px;border-radius:2px;background:var(--go);animation:wv .8s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.15s}.wave i:nth-child(3n){animation-delay:.3s}
.livewords:empty::before{content:"Listening. Say it your way.";color:var(--ink3)}
.typing{align-self:flex-start;background:#ECEDF0;border-radius:16px;padding:12px 14px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#9AA0AC;animation:bob 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes ring{from{transform:scale(.9);opacity:.5}to{transform:scale(1.35);opacity:0}}
@keyframes wv{0%,100%{height:3px}50%{height:12px}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-4px)}}
.typebox{display:flex;gap:8px}
.typebox textarea{flex:1;min-height:54px;max-height:120px;border:1.5px solid var(--rule);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;resize:none;background:#fff;color:var(--ink)}
.typebox button{width:54px;border-radius:12px;background:var(--ink);color:#fff;font-weight:700}
/* key points tracker */
.kp{border-top:1px solid var(--rule);padding-top:1.2cqh;display:flex;flex-direction:column;gap:6px}
.kp div{display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--ink3);transition:color .3s}
.kp div i{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--rule);display:grid;place-items:center;flex:0 0 auto;transition:all .3s}
.kp div.on{color:var(--ink)}
.kp div.on i{background:var(--go);border-color:var(--go);color:#fff}
/* catch */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:1.2cqh}
.opt{text-align:left;border:1.5px solid var(--rule);border-radius:12px;padding:11px 14px;font-size:15px;line-height:1.3;background:#fff}
.opt:hover{border-color:var(--ink3)}
.opt.right{border-color:var(--go);background:var(--go-soft)}
.opt.wrongpick{border-color:var(--gap);background:var(--gap-soft)}
.fix{margin-top:10px;font-size:14.5px;line-height:1.4;padding:10px 12px;border-radius:10px;background:var(--go-soft)}
/* result */
.badge{width:max(84px,11cqh);height:max(84px,11cqh);border-radius:50%;background:var(--go);color:#fff;display:grid;place-items:center;animation:land .6s cubic-bezier(.2,1.4,.4,1) both}
.badge svg{width:46%;height:46%}
@keyframes land{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.score{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--go);margin-top:2.4cqh}
.got{list-style:none;margin:2cqh 0 0;padding:0;display:flex;flex-direction:column}
.got li{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:1.3cqh 0;border-top:1px solid var(--rule);font-size:max(15px,2cqh);line-height:1.3}
.got li:last-child{border-bottom:1px solid var(--rule)}
.got li i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700}
.got li.y i{background:var(--go);color:#fff}
.got li.n i{background:var(--gap-soft);color:var(--gap)}
.got li.n span b{color:var(--gap)}
.said{margin-top:1.6cqh;font-size:13.5px;line-height:1.4;color:var(--ink2)}
.said summary{cursor:pointer;font-weight:600;color:var(--ink)}
.said p{margin-top:6px}
/* done */
.growth{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:2.4cqh}
.growth > div{border-radius:14px;padding:1.6cqh 14px;background:#ECEDF0}
.growth > div.after{background:var(--go-soft)}
.growth small{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.growth b{display:block;font-family:var(--serif);font-weight:500;font-size:max(34px,5cqh);line-height:1.05;margin-top:4px}
.growth .after b{color:var(--go)}
.growth span{font-size:12.5px;color:var(--ink2)}
.reveal{margin-top:2.2cqh;padding-top:1.8cqh;border-top:1px solid var(--rule);font-size:max(14.5px,1.95cqh);line-height:1.45;color:var(--ink2)}
.reveal b{color:var(--ink)}
.draftflag{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;z-index:5;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  curSrc=[S.kffEmp,S.gbpi,S.kffPar,S.hhs,S.rec,S.census,S.ccf,S.hc,S.kffStatus,S.kemp,S.paFlier,S.ajcN,S.wabe,S.cbeat23,S.dch,S.care,S.ajcJ,S.gpb];
  render(top()+practBar(4)+'<div class="body"><p class="eyebrow">Lesson done</p><h2>You went from '+a+' to '+b+' of the three points Maya needs you to make.</h2>'+
    '<div class="growth"><div><small>1st try</small><b>'+a+' of 3</b><span>Before the lesson</span></div><div class="after"><small>2nd try</small><b>'+b+' of 3</b><span>After 5 minutes</span></div></div>'+
    '<div class="reveal">Behind the curtain: Maya stood in for <b>Keisha Lance Bottoms</b>, the Democrat running for Georgia governor in 2026, against Republican <b>Rick Jackson</b>. Every fact and position is real and sourced.</div></div>'+
    '<div class="foot"><button class="srcbtn" data-src data-live>All sources, with links ('+curSrc.length+')</button>'+cta("Back to lessons · next one tomorrow","home")+'</div>');
}

/* ---------- routing ---------- */
function go(where){
  if(where==="home") return home();
  if(where==="start") return st.seenHow?cover():(st.seenHow=true,how());
  if(where==="cover") return cover();
  if(where==="pintro") return pintro();
  if(where==="try1") return tryDoor(0,"try1");
  if(where==="hear") return hear();
  if(where==="catch") return catchIt();
  if(where==="try2") return tryDoor(3,"try2");
  if(where==="result") return result();
  if(where==="done") return done();
  if(where[0]==="L") return learn(+where.slice(1));
}
function sheet(live){
  var d=document.createElement("div"); d.className="scrim";
  d.innerHTML='<div class="sheet" role="dialog" aria-label="Sources"><h3>Sources</h3>'+(live?'':'<p class="small">Each number on this screen matches a source below. Clickable links to every source are on the last screen of the lesson.</p>')+
    '<ol>'+curSrc.map(function(s,n){return '<li><i>'+(n+1)+'</i><span>'+(live?'<a href="'+s[1]+'" target="_blank" rel="noopener">'+s[0]+' ↗</a>':s[0])+'</span></li>';}).join("")+'</ol><button class="cta" id="closeS">Back to the lesson</button></div>';
  app.appendChild(d);
  d.onclick=function(e){ if(e.target===d||e.target.id==="closeS") d.remove(); };
}
function toast(t){ var d=document.createElement("div"); d.className="toast"; d.textContent=t; app.appendChild(d); setTimeout(function(){ d.remove(); },2600); }
app.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]"); if(g){ go(g.dataset.go); return; }
  var s=e.target.closest("[data-src]"); if(s){ sheet(s.hasAttribute("data-live")); return; }
  var l=e.target.closest("[data-lock]"); if(l){ toast("This one opens "+l.dataset.lock.toLowerCase()+". One lesson a day helps it stick."); return; }
});
function boot(){ var q=location.hash.slice(1); document.querySelectorAll(".scrim").forEach(function(x){x.remove();}); if(/^L\d+$/.test(q)) learn(Math.min(+q.slice(1),NL-1)); else if(q) go(q); else home(); }
window.addEventListener("hashchange",boot); boot();
})();
</script>
