<title>Warmup Issue Lessons</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500;1,6..72,600&display=swap">
<style>
/* Warmup issue lessons, v2 prototype.
   Layout concept: one phone-shaped column; a fixed top (close + story bar), a body that holds one scene and scales
   to fit with no scrolling (one --k variable sets every size), and a fixed bottom row (Sources + the main button).
   Single light look, like the live app. Tokens follow the v12 lesson screens (styles12.css) so the redesign can drop
   into the app without a new visual language. */
:root {
  color-scheme: light;
  --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  --serif: "Newsreader", Georgia, "Times New Roman", serif;
  --ink: #3c3c3c; --body: #4b4b4b; --muted: #5a5a5a; --faint: #6b7178;
  --line: #e5e5e5; --panel: #f4f6f8; --page: #ece7df; --white: #ffffff;
  --green: #35b57c; --green-deep: #1b7a4d; --btn: #1f8455; --btn-edge: #145c3a; --btn-blue: #3567b8; --green-soft: #e7f6ee; --green-edge: #2a9465;
  --red: #b3261e; --red-soft: #fbeceb;
  --amber: #c27c12; --amber-fill: #f2b134; --amber-soft: #fdf3dc;
  --blue: #2f6f9f; --blue-fill: #4a7fd1; --blue-soft: #e3eef7;
  --dem: #2f5fa8; --rep: #b04a3a;
  --clip: #fffdf8; --clip-line: #e4ddcf;
  --focus: #1F4C91;
  --k: 1;
}
* { box-sizing: border-box; }
html, body, #wu { height: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }

/* ---------- the stage: full screen on a phone, a phone frame on a laptop ---------- */
.stage { height: 100%; display: flex; align-items: center; justify-content: center; padding: 0; }
.phone { position: relative; width: 100%; height: 100%; background: var(--white); display: flex; flex-direction: column; overflow: hidden; }
@media (min-width: 560px) and (min-height: 560px) {
  .stage { padding: 18px 16px; }
  .phone { width: 402px; height: min(874px, calc(100% - 4px)); border-radius: 34px; box-shadow: 0 22px 60px -28px rgba(40,30,10,.45), 0 0 0 1px rgba(0,0,0,.06); }
}
.scr { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); }

/* top row: close + story bar (one segment per screen, full or empty) */
.top { display: flex; align-items: center; gap: 12px; height: 26px; flex: none; }
.x { border: 0; background: none; padding: 0; width: 26px; height: 26px; color: #9a9a9a; cursor: pointer; display: grid; place-items: center; border-radius: 8px; }
.x svg { width: 18px; height: 18px; }
.seg { display: flex; gap: 4px; flex: 1; min-width: 0; align-items: center; }
.seg i { flex: 1; height: 5px; border-radius: 5px; background: var(--line); transition: background .25s; }
.seg i.full { background: var(--green); }
.seg.door i.full { background: var(--blue-fill); }
.chip-done { flex: none; display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--green-soft); color: var(--green-deep); font: 800 11px/1 var(--sans); }

/* body: one scene, scaled to fit */
.body { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: calc(14px * var(--k)); padding-top: calc(14px * var(--k)); }
.body > * { flex: none; }
.body.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
.stack .col i.m { background: var(--amber-fill); }
details > summary { list-style: revert; }
.body .grow { flex: 1 1 auto; min-height: 0; }
.kick { font: 800 calc(12px * var(--k))/1.2 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0; }
h1, h2 { margin: 0; font: 800 calc(24px * var(--k))/1.2 var(--sans); letter-spacing: -.01em; color: var(--ink); text-wrap: balance; }
h1 { font-size: calc(27px * var(--k)); }
.body p { margin: 0; font: 500 calc(16px * var(--k))/1.45 var(--sans); color: var(--body); text-wrap: pretty; }
.body p.small { font-size: calc(14px * var(--k)); color: var(--muted); }
.sup { font: 700 .55em/0 var(--sans); vertical-align: .9em; margin-left: 1px; color: inherit; }
.pic { border-radius: 18px; padding: calc(14px * var(--k)) 12px; background: var(--panel); }
.pic.plain { background: transparent; padding: 0; }
.do { display: flex; align-items: center; gap: 8px; font: 700 calc(14px * var(--k))/1.3 var(--sans); color: var(--blue); }
.do svg { width: 18px; height: 18px; flex: none; }
.do.done { color: var(--green-deep); }

/* bottom row: Sources (small) + the main button, which previews the next takeaway */
.foot { flex: none; display: flex; gap: 10px; margin-top: 12px; }
.src { flex: none; min-height: 54px; padding: 0 12px; border: 2px solid var(--line); border-bottom-width: 4px; background: #fff; border-radius: 16px; font: 800 13px/1 var(--sans); color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.src svg { width: 16px; height: 16px; }
.next { flex: 1; min-width: 0; border: 0; border-radius: 16px; min-height: 54px; padding: 6px 12px 8px; text-wrap: balance; background: var(--btn); color: #fff; font: 800 15.5px/1.2 var(--sans); cursor: pointer; box-shadow: 0 4px 0 var(--btn-edge); transition: background .2s, box-shadow .2s, color .2s; }
.next:active { transform: translateY(4px); box-shadow: none; }
.next[aria-disabled="true"] { background: #e9ecef; color: #6b7178; box-shadow: 0 4px 0 #d4d8dd; cursor: default; }
.next[aria-disabled="true"]:active { transform: none; box-shadow: 0 4px 0 #d4d8dd; }
.next.blue { background: var(--btn-blue); box-shadow: 0 4px 0 #24497f; }
.next.blue[aria-disabled="true"] { background: #e9ecef; color: #6b7178; box-shadow: 0 4px 0 #d4d8dd; }
.ghost { border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: #fff; color: var(--ink); font: 800 14px/1 var(--sans); min-height: 44px; padding: 0 14px; cursor: pointer; }
.linkish { border: 0; background: none; color: var(--blue); font: 700 13.5px/1.3 var(--sans); padding: 6px 2px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* screen tag (Robert reviews by number) */
.tag { position: absolute; right: 24px; bottom: calc(2px + env(safe-area-inset-bottom, 0px)); font: 700 9.5px/1 var(--sans); color: #b8bcc2; letter-spacing: .04em; pointer-events: none; }

/* sources sheet */
.sheet { position: absolute; inset: 0; background: rgba(0,0,0,.28); display: none; align-items: flex-end; z-index: 9; }
.sheet.on { display: flex; }
.sheet .card { width: 100%; background: #fff; border-radius: 22px 22px 0 0; padding: 18px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 82%; overflow: auto; }
.sheet h3 { margin: 0; font: 800 19px/1.2 var(--sans); }
.sheet .note { margin: 4px 0 12px; font: 500 13.5px/1.35 var(--sans); color: var(--muted); }
.sheet ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 9px; font: 500 14.5px/1.35 var(--sans); color: var(--body); }
.sheet ol a { color: var(--blue); }
.sheet .close { margin-top: 16px; width: 100%; }

/* ---------- shared pieces ---------- */
.race { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 700 calc(12.5px * var(--k))/1.3 var(--sans); color: var(--muted); }
.race b { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; background: var(--panel); color: var(--ink); font-weight: 800; }
.fine { font: 500 calc(12px * var(--k))/1.35 var(--sans) !important; color: var(--faint) !important; }
.quote { font: 500 calc(21px * var(--k))/1.3 var(--serif); color: var(--ink); margin: 0; text-wrap: pretty; }
.quote::before { content: "\201C"; } .quote::after { content: "\201D"; }
.who { font: 700 calc(13px * var(--k))/1.3 var(--sans); color: var(--muted); }
.clip { display: flex; flex-direction: column; gap: 6px; padding: calc(12px * var(--k)) 14px; background: var(--clip); border: 1px solid var(--clip-line); border-radius: 6px; box-shadow: 0 6px 14px -10px rgba(60,40,10,.45); transform: rotate(-.6deg); }
.clip .o { font: 600 italic 12.5px/1 var(--serif); color: #5b554d; }
.clip .h { font: 600 calc(19px * var(--k))/1.22 var(--serif); color: #24211d; }
.clip .d { font: 500 11.5px/1 var(--sans); color: #7a736a; }

/* cover */
.goals { display: flex; flex-direction: column; gap: calc(12px * var(--k)); }
.goal { display: grid; grid-template-columns: calc(52px * var(--k)) 1fr; gap: 12px; align-items: center; }
.goal .ic { width: calc(52px * var(--k)); height: calc(52px * var(--k)); border-radius: 14px; background: var(--panel); display: grid; place-items: center; }
.goal .ic svg { width: 78%; height: 78%; }
.goal p { font: 600 calc(15.5px * var(--k))/1.35 var(--sans) !important; color: var(--ink) !important; }
.parts { display: flex; gap: 18px; font: 800 calc(14px * var(--k))/1.2 var(--sans); }
.parts span { display: inline-flex; align-items: center; gap: 7px; }
.parts .l { color: var(--green-deep); } .parts .d { color: var(--blue); }
.parts svg { width: 20px; height: 20px; }
.parts small { font-weight: 600; color: var(--muted); }

/* options (predict, apply, check) */
.opts { display: flex; flex-direction: column; gap: calc(8px * var(--k)); }
.opt { text-align: left; width: 100%; min-height: calc(48px * var(--k)); padding: calc(10px * var(--k)) 14px; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 14px; background: #fff; font: 700 calc(15px * var(--k))/1.3 var(--sans); color: var(--ink); cursor: pointer; display: flex; gap: 10px; align-items: center; }
.opt .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #c9cdd3; flex: none; display: grid; place-items: center; }
.opt[aria-pressed="true"] { border-color: var(--blue-fill); background: var(--blue-soft); }
.opt[aria-pressed="true"] .dot { border-color: var(--blue-fill); background: var(--blue-fill); box-shadow: inset 0 0 0 3px #fff; }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .dot { border-color: var(--green); background: var(--green); box-shadow: inset 0 0 0 3px #fff; }
.opt.wrong { border-color: #e2a39e; background: var(--red-soft); }
.opt.wrong .dot { border-color: var(--red); background: var(--red); box-shadow: inset 0 0 0 3px #fff; }
.opt:disabled { cursor: default; }
.say { border-radius: 14px; padding: calc(10px * var(--k)) 13px; font: 500 calc(14.5px * var(--k))/1.4 var(--sans); }
.say.good { background: var(--green-soft); color: #1d5b3c; }
.say.bad { background: var(--red-soft); color: #7a1c16; }
.say.info { background: var(--blue-soft); color: #1f4466; }
.say b { font-weight: 800; }

/* ---------- Rule model: the income line ---------- */
.ruler { display: flex; flex-direction: column; gap: calc(10px * var(--k)); }
.ruler svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: none; }
.ruler .zone-t { font: 800 13px var(--sans); }
.ruler .tick { font: 600 11.5px var(--sans); fill: var(--muted); }
.ruler .nm { font: 800 13px var(--sans); fill: var(--ink); }
.ruler .handle { cursor: grab; }
.ruler input[type=range] { width: 100%; margin: 0; accent-color: var(--blue-fill); height: 28px; }
.readout { border-radius: 14px; padding: calc(11px * var(--k)) 13px; background: #fff; border: 2px solid var(--line); display: flex; flex-direction: column; gap: 4px; min-height: calc(84px * var(--k)); }
.readout .amt { font: 800 calc(18px * var(--k))/1.15 var(--sans); color: var(--ink); }
.readout .st { font: 700 calc(14.5px * var(--k))/1.35 var(--sans); }
.readout .st.g { color: var(--green-deep); } .readout .st.a { color: #8a5608; } .readout .st.b { color: var(--blue); } .readout .st.r { color: var(--red); }
.readout .sub { font: 500 calc(13.5px * var(--k))/1.35 var(--sans); color: var(--muted); }
.who-row { display: flex; gap: 6px; flex-wrap: wrap; }
.who-row button { border: 2px solid var(--line); background: #fff; border-radius: 20px; min-height: 36px; padding: 0 12px; font: 800 13px/1 var(--sans); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.who-row button[aria-pressed="true"] { border-color: var(--blue-fill); background: var(--blue-soft); }
.found { display: flex; gap: 6px; align-items: center; font: 700 calc(13px * var(--k))/1.2 var(--sans); color: var(--muted); flex-wrap: wrap; }
.found i { width: 22px; height: 8px; border-radius: 4px; background: var(--line); }
.found i.on { background: var(--green); }
.toggle { display: grid; grid-template-columns: 1fr 1fr; background: var(--panel); border-radius: 14px; padding: 4px; gap: 4px; }
.toggle button { border: 0; border-radius: 11px; min-height: 40px; font: 800 calc(14px * var(--k))/1.15 var(--sans); color: var(--muted); background: transparent; cursor: pointer; padding: 4px 6px; }
.toggle button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* count of people */
.count { display: flex; flex-direction: column; gap: calc(10px * var(--k)); }
.count .lab { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.count .lab b { font: 800 calc(22px * var(--k))/1.1 var(--sans); }
.count .lab b.r { color: var(--red); }
.count .lab span { font: 600 calc(14px * var(--k))/1.2 var(--sans); color: var(--muted); }
.count .ppl { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px 8px; width: min(100%, calc(300px * var(--k))); }
.count .ppl svg { width: 100%; height: auto; display: block; }

/* bars (expected vs got; jobs) */
.hbars { display: flex; flex-direction: column; gap: calc(12px * var(--k)); }
.hb { display: grid; grid-template-columns: 1fr auto; row-gap: 5px; column-gap: 10px; align-items: center; }
.hb > span { grid-column: 1 / -1; font: 600 calc(13.5px * var(--k))/1.25 var(--sans); color: var(--muted); }
.hb .t { height: calc(20px * var(--k)); border-radius: 11px; background: transparent; }
.hb .t i { display: block; height: 100%; border-radius: 11px; }
.hb b { font: 800 calc(18px * var(--k))/1 var(--sans); min-width: 72px; text-align: right; }

/* compare: same rows for both candidates */
.cmp { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.cmp .hd { display: flex; align-items: center; gap: 8px; padding-bottom: 8px; }
.cmp .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 13px/1 var(--sans); flex: none; }
.cmp .av.d { background: var(--dem); } .cmp .av.r { background: var(--rep); }
.cmp .hd b { display: block; font: 800 calc(14px * var(--k))/1.15 var(--sans); color: var(--ink); }
.cmp .hd small { display: block; font: 600 11.5px/1.2 var(--sans); color: var(--muted); }
.cmp .rl { grid-column: 1 / -1; font: 800 calc(11px * var(--k))/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--faint); padding: calc(9px * var(--k)) 0 5px; border-top: 1.5px solid var(--line); }
.cmp .cell { font: 600 calc(13.5px * var(--k))/1.35 var(--sans); color: var(--ink); padding-bottom: 2px; }
.cmp .cell q { font: 500 italic calc(14px * var(--k))/1.3 var(--serif); }
.office { display: flex; gap: 10px; align-items: flex-start; border-radius: 14px; background: var(--amber-soft); padding: calc(10px * var(--k)) 12px; font: 600 calc(13.5px * var(--k))/1.4 var(--sans); color: #5f4208; }
.office svg { width: 22px; height: 22px; flex: none; margin-top: 1px; }

/* sort: known vs not shown */
.sort { display: flex; flex-direction: column; gap: calc(8px * var(--k)); }
.sitem { border: 2px solid var(--line); border-radius: 14px; padding: calc(9px * var(--k)) 11px; background: #fff; display: flex; flex-direction: column; gap: 8px; }
.sitem p { font: 600 calc(14px * var(--k))/1.35 var(--sans) !important; color: var(--ink) !important; }
.sitem .pick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.sitem .pick button { min-height: 36px; border-radius: 10px; border: 2px solid var(--line); background: #fff; font: 800 12.5px/1.1 var(--sans); color: var(--muted); cursor: pointer; }
.sitem .pick button[aria-pressed="true"].k { border-color: var(--green); background: var(--green-soft); color: var(--green-deep); }
.sitem .pick button[aria-pressed="true"].n { border-color: var(--amber-fill); background: var(--amber-soft); color: #7a4d06; }
.sitem .why { font: 500 calc(13px * var(--k))/1.35 var(--sans); color: var(--muted); }
.sitem.ok { border-color: #bfe6cf; } .sitem.no { border-color: #f0c2bd; }

/* ---------- Chain model: the route ---------- */
.route svg { display: block; width: 100%; height: auto; overflow: visible; }
.route .lbl { font: 800 12px var(--sans); fill: var(--muted); letter-spacing: .06em; }
.route .step-t { font: 700 11.5px var(--sans); fill: var(--ink); }
.cost { display: flex; flex-direction: column; gap: 6px; }
.cost .bar { display: flex; height: calc(22px * var(--k)); border-radius: 8px; overflow: hidden; background: #fff; border: 2px solid var(--line); }
.cost .bar i { display: block; height: 100%; border-right: 2px solid #fff; transition: width .4s; }
.cost .bar i.w { background: #c9ced6; } .cost .bar i.t { background: var(--red); } .cost .bar i.m { background: var(--amber-fill); }
.cost .key { display: flex; gap: 12px; flex-wrap: wrap; font: 700 calc(12px * var(--k))/1.2 var(--sans); color: var(--muted); }
.cost .key span { display: inline-flex; align-items: center; gap: 5px; }
.cost .key i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.stack { display: flex; align-items: flex-end; gap: 10px; }
.stack .col { display: flex; flex-direction: column-reverse; width: 46px; border-radius: 8px; overflow: hidden; border: 2px solid var(--line); background: #fff; min-height: 10px; }
.stack .col i { display: block; height: calc(18px * var(--k)); background: #c9ced6; border-top: 2px solid #fff; }
.stack .col i.t { background: var(--red); }
.stack p { font: 600 calc(13.5px * var(--k))/1.35 var(--sans) !important; }

/* ---------- At the door ---------- */
.doorpic { border-radius: 18px; overflow: hidden; flex: none; background: #f4efe7; }
.doorpic svg { display: block; width: 100%; height: auto; max-height: calc(210px * var(--k)); }
.thread { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; min-height: 0; }
.bub { max-width: 88%; border-radius: 16px; padding: 9px 12px; font: 500 calc(14.5px * var(--k))/1.4 var(--sans); }
.bub small { display: block; font: 800 10.5px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; margin-bottom: 4px; opacity: .75; }
.bub.v { background: var(--panel); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 5px; }
.bub.me { background: var(--blue-soft); color: #1f3550; align-self: flex-end; border-bottom-right-radius: 5px; }
.bub.c { background: var(--green-soft); color: #1d4a33; align-self: flex-end; border-bottom-right-radius: 5px; }
.bub .pt { display: inline; border-radius: 4px; padding: 0 2px; }
.bub .pt[data-n]::after { content: attr(data-n); display: inline-grid; place-items: center; width: 15px; height: 15px; margin-left: 4px; border-radius: 50%; background: var(--green-deep); color: #fff; font: 800 9.5px/1 var(--sans); vertical-align: 1px; }
.speak { display: flex; flex-direction: column; gap: 8px; }
.mic { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; background: #fff; min-height: 58px; }
.mic button.m { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--green); color: #fff; display: grid; place-items: center; cursor: pointer; flex: none; box-shadow: 0 3px 0 var(--green-deep); }
.mic button.m.on { background: var(--red); box-shadow: 0 3px 0 #7a1c16; animation: pulse 1.2s infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.mic button.m svg { width: 20px; height: 20px; }
.mic .live { flex: 1; min-width: 0; font: 500 calc(14px * var(--k))/1.35 var(--sans); color: var(--muted); }
.typebox { width: 100%; min-height: 72px; resize: none; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; font: 500 15px/1.4 var(--sans); color: var(--ink); }
.row2 { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.mode { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 12px; font: 800 11px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; }
.mode.ai { background: #ece6fb; color: #4b2c99; }

.big-ok { display: flex; align-items: center; gap: 12px; }

.miss { display: flex; flex-direction: column; gap: 8px; }

.miss button.wrong { border-color: var(--red); background: var(--red-soft); }

/* home */
.home-h { font: 800 calc(26px * var(--k))/1.15 var(--sans); }
.lrow { display: grid; grid-template-columns: calc(48px * var(--k)) 1fr; gap: 12px; align-items: center; text-align: left; width: 100%; border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px; background: #fff; padding: calc(10px * var(--k)) 12px; cursor: pointer; color: var(--ink); }

<script>
/* ===== core.js ===== */
/* Warmup issue lessons v2: the engine.
   A lesson is data (src/lessons/*.js). Each scene names a type; WU.scene[type] draws it and wires its interaction.
   The engine owns the shell: the story bar, the bottom row, the sources sheet, scale-to-fit, the screen tag and
   gating (a scene that asks the learner to do something keeps its button locked, with the instruction as its label,
   until it's done). No framework, no build step at runtime, so it can be pasted into the single-file app. */
(function () {
  "use strict";
  var WU = (window.WU = window.WU || {});
  WU.scene = WU.scene || {};
  WU.lessons = WU.lessons || {};
  var Q = new URLSearchParams(location.search);
  WU.fast = Q.has("fast");

  WU.esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  /* a numbered source mark; numbers are per lesson, so the sheet and the end screen agree */
  WU.sup = function () { return '<span class="sup">' + Array.prototype.slice.call(arguments).join(",") + "</span>"; };
  WU.money = function (n) { return "$" + Math.round(n).toLocaleString("en-US"); };
  WU.icon = {
    x: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>',
    book: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C6.5 4 9.5 4 12 6c2.5-2 5.5-2 8-.5V19c-2.5-1.5-5.5-1.5-8 .5-2.5-2-5.5-2-8-.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 6v13.5" stroke="currentColor" stroke-width="2"/></svg>',
    door: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4h12v17M3.5 21h17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="15" cy="13" r="1.3" fill="currentColor"/></svg>',
    doc: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 12h5M10 16h5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    hand: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 013 0V10m0 0V4.5a1.5 1.5 0 013 0V10m0 0V6.5a1.5 1.5 0 013 0V14c0 4-2.5 7-6.5 7S6 19 4.5 15.5L3 12c-.6-1.4 1.3-2.4 2.2-1.2L7 13V8.5a1.5 1.5 0 013 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    dash: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 12h10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
    bang: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v8" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="12" cy="18.5" r="1.8" fill="currentColor"/></svg>',
    mic: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0012 0M12 17v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
    stop: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>',
    play: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>',
    capitol: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M6 20v-7M10 20v-7M14 20v-7M18 20v-7M4.5 13h15M12 4v2M7 13a5 5 0 0110 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };

  /* ---------- state ---------- */
  var app = (WU.app = { lesson: null, part: "learn", i: 0, st: {} });
  function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem("wu2:" + k) || "null"); localStorage.setItem("wu2:" + k, JSON.stringify(v)); } catch (e) { return null; } }
  WU.store = store;

  /* ---------- shell ---------- */
  var root, scr, body, nextBtn, srcBtn, seg, tagEl, sheet;
  function shell() {
    root = document.getElementById("wu");
    root.innerHTML = '<div class="stage"><div class="phone" id="phone"><div class="scr" id="scr">' +
      '<div class="top"><button class="x" id="close" aria-label="Close and go to the lesson list">' + WU.icon.x + '</button><div class="seg" id="seg" aria-hidden="true"></div></div>' +
      '<main class="body" id="body" aria-live="polite"></main>' +
      '<div class="foot" id="foot"><button class="src" id="srcb" type="button">' + WU.icon.doc + 'Sources</button><button class="next" id="next" type="button"></button></div>' +
      '<div class="tag" id="tag"></div>' +
      '<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h"><div class="card"></div></div>' +
      "</div></div></div>";
    scr = document.getElementById("scr"); body = document.getElementById("body"); nextBtn = document.getElementById("next");
    srcBtn = document.getElementById("srcb"); seg = document.getElementById("seg"); tagEl = document.getElementById("tag"); sheet = document.getElementById("sheet");
    document.getElementById("close").onclick = function () { WU.speak.stop(); WU.go("home"); };
    nextBtn.onclick = function () { if (nextBtn.getAttribute("aria-disabled") === "true") { nudge(); return; } if (app.onNext) app.onNext(); };
    srcBtn.onclick = openSources;
    sheet.onclick = function (e) { if (e.target === sheet) closeSheet(); };
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheet.classList.contains("on")) closeSheet(); });
    window.addEventListener("resize", fit);
  }
  function nudge() { /* a locked button points at what to do */ var d = body.querySelector(".do:not(.done)"); if (d) { d.animate && d.animate([{ transform: "translateX(0)" }, { transform: "translateX(5px)" }, { transform: "translateX(-4px)" }, { transform: "translateX(0)" }], { duration: 280 }); } }

  /* ---------- scale to fit: one variable sets every size, the largest that fits with no scrolling ---------- */
  function fit() {
    if (!body) return;
    var k = 1.12, min = 0.74;
    if (body.dataset.fallback) { body.classList.remove("scroll"); delete body.dataset.fallback; }
    if (body.classList.contains("scroll")) { scr.style.setProperty("--k", 1); app.k = 1; return; }
    scr.style.setProperty("--k", k);
    var guard = 0;
    while (body.scrollHeight > body.clientHeight + 1 && k > min && guard++ < 40) { k = Math.round((k - 0.02) * 100) / 100; scr.style.setProperty("--k", k); }
    app.k = k;
    /* last resort on very short screens: scroll rather than clip (the walk test reports every screen that does this) */
    if (body.scrollHeight > body.clientHeight + 1) { body.classList.add("scroll"); body.dataset.fallback = "1"; }
  }
  WU.fit = function () { requestAnimationFrame(fit); };

  /* ---------- sources sheet: numbered for this lesson; links on the last screen ---------- */
  function openSources() {
    var L = app.lesson, ids = app.srcIds || [];
    if (!L || !ids.length) return;
    var items = ids.map(function (n) { var s = L.sources[n - 1]; return "<li value=\"" + n + "\">" + WU.esc(s.t) + "</li>"; }).join("");
    sheet.querySelector(".card").innerHTML = '<h3 id="sheet-h">Sources</h3><p class="note">Every number on this screen has a mark. Links are on the last screen.</p><ol>' + items + '</ol><button class="ghost close" type="button">Close</button>';
    sheet.querySelector(".close").onclick = closeSheet;
    sheet.classList.add("on"); sheet.querySelector(".close").focus();
  }
  function closeSheet() { sheet.classList.remove("on"); srcBtn.focus(); }

  /* ---------- routing ---------- */
  WU.go = function (where) {
    WU.speak.stop();
    if (where === "home") { app.lesson = null; renderHome(); try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} return; }
    var L = WU.lessons[where]; if (!L) return renderHome();
    app.lesson = L; app.part = "learn"; app.i = 0; app.st = { lesson: where };
    try { history.replaceState(null, "", "#" + where); } catch (e) {}
    show();
  };
  WU.next = function () {
    var L = app.lesson, list = app.part === "learn" ? L.learn : L.door;
    if (app.i < list.length - 1) { app.i++; show(); return; }
    if (app.part === "learn") { app.part = "door"; app.i = 0; show(); return; }
    WU.go("home");
  };
  WU.jump = function (part, i) { app.part = part; app.i = i; show(); };

  function bar() {
    var L = app.lesson, nL = L.learn.length, nD = L.door.length, out = "";
    if (app.part === "learn") { for (var a = 0; a < nL; a++) out += '<i class="' + (a <= app.i ? "full" : "") + '"></i>'; seg.className = "seg"; }
    else { out = '<span class="chip-done">' + WU.icon.check.replace("<svg", '<svg width="11" height="11"') + "Learn</span>"; for (var b = 0; b < nD; b++) out += '<i class="' + (b <= app.i ? "full" : "") + '"></i>'; seg.className = "seg door"; }
    seg.innerHTML = out;
    seg.setAttribute("aria-label", (app.part === "learn" ? "Learn, screen " : "At the door, screen ") + (app.i + 1) + " of " + (app.part === "learn" ? nL : nD));
  }

  /* the scene's own controller calls ctx.ready(label) when its interaction is done, or ctx.lock(instruction) */
  function show() {
    var L = app.lesson, list = app.part === "learn" ? L.learn : L.door, sc = list[app.i];
    var draw = WU.scene[sc.type];
    if (!draw) throw new Error("No scene type " + sc.type);
    WU.speak.stop();
    bar();
    app.srcIds = sc.src || [];
    srcBtn.hidden = !app.srcIds.length;
    tagEl.textContent = L.tag + " " + (app.part === "learn" ? (app.i === 0 ? "Cover" : app.i) : "D" + (app.i + 1));
    nextBtn.className = "next" + (app.part === "door" ? " blue" : "");
    var ctx = {
      L: L, sc: sc, st: app.st, body: body,
      ready: function (label) { nextBtn.removeAttribute("aria-disabled"); if (label) nextBtn.textContent = label; else nextBtn.textContent = sc.btn || "Continue"; WU.fit(); },
      lock: function (instr) { nextBtn.setAttribute("aria-disabled", "true"); nextBtn.textContent = instr; },
      label: function (t) { nextBtn.textContent = t; },
      onNext: function (fn) { app.onNext = fn; },
      next: WU.next
    };
    app.onNext = WU.next;
    body.classList.toggle("scroll", !!sc.scroll);
    body.scrollTop = 0;
    body.innerHTML = draw.html ? draw.html(sc, ctx) : "";
    nextBtn.removeAttribute("aria-disabled");
    nextBtn.textContent = sc.btn || "Continue";
    if (draw.mount) draw.mount(sc, ctx);
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    var h = body.querySelector("h1,h2"); if (h) { h.setAttribute("tabindex", "-1"); if (!WU.firstPaint) h.focus({ preventScroll: true }); }
    WU.firstPaint = false;
  }
  WU.refit = fit;

  /* ---------- home: the two rebuilt lessons, and the three still on the old design ---------- */
  function renderHome() {
    bodyHome();
  }
  function bodyHome() {
    body.classList.remove("scroll");
    seg.innerHTML = ""; seg.className = "seg"; tagEl.textContent = "Home"; srcBtn.hidden = true;
    var rows = (WU.home || []).map(function (h) {
      var on = !!WU.lessons[h.id];
      return '<button class="lrow' + (on ? "" : " off") + '" ' + (on ? 'data-go="' + h.id + '"' : 'disabled aria-disabled="true"') + ' type="button"><span class="ic" style="background:' + h.color + '">' + h.icon + '</span><span><b>' + WU.esc(h.name) + '</b><span class="qq">“' + WU.esc(h.quote) + '”</span><span class="fm">' + WU.esc(h.format) + "</span></span></button>";
    }).join("");
    body.innerHTML = '<p class="kick">Warmup issue lessons · prototype</p><h1 class="home-h">Learn the issue, then explain it at the door</h1>' +
      '<p class="small">Two lessons rebuilt on the new system. Each takes about five minutes. The other three are still on the old design.</p>' +
      '<div style="display:flex;flex-direction:column;gap:10px">' + rows + "</div>" +
      '<p class="fine">A review prototype, separate from the live Warmup app. Built by Warmup from public sources. Not affiliated with or approved by any campaign.</p>';
    body.querySelectorAll("[data-go]").forEach(function (b) { b.onclick = function () { WU.go(b.getAttribute("data-go")); }; });
    nextBtn.className = "next";
    nextBtn.removeAttribute("aria-disabled");
    nextBtn.textContent = "Start: health insurance";
    app.onNext = function () { WU.go("health"); };
    fit();
  }

  /* ---------- boot ---------- */
  WU.firstPaint = true;
  WU.boot = function () {
    shell();
    route();
    window.addEventListener("hashchange", function () { var h = (location.hash || "").replace("#", ""); if (!app.lesson || h.indexOf(app.lesson.id) !== 0) route(); });
  };
  function route() {
    var h = (location.hash || "").replace("#", "");
    var m = /^(\w+?)(?:-(learn|door)(\d+))?$/.exec(h);
    if (Q.get("lesson")) m = [null, Q.get("lesson"), Q.get("part") || "learn", Q.get("i") || "0"];
    if (m && WU.lessons[m[1]]) { WU.go(m[1]); if (m[2]) WU.jump(m[2], +m[3] || 0); }
    else renderHome();
  }
})();

/* ===== coach.js ===== */
/* Warmup issue lessons v2: feedback on a spoken (or typed) answer.
   Two honest modes, always labeled on screen:
   - "AI feedback": Claude reads the answer against the lesson's rubric and approved facts (only where the page can
     reach Claude: the claude.ai artifact's `sample` capability, or a future server endpoint, WU.coach.endpoint).
   - "Quick check": phrase matching, no AI. It looks for key phrases, so it can miss a good answer or be fooled.
   Either way a point is credited only when the learner's own words show it: the result quotes those words, and an
   AI credit whose quote isn't in the answer is dropped. */
(function () {
  "use strict";
  var WU = (window.WU = window.WU || {});
  function norm(s) { return String(s || "").toLowerCase().replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/\s+/g, " ").trim(); }
  function sentences(t) { return String(t || "").replace(/([.!?])\s+/g, "$1\n").split(/\n+/).map(function (s) { return s.trim(); }).filter(Boolean); }
  /* the sentence (or, for one long run-on transcript, the 14 words) around a match */
  function around(t, re) {
    var ss = sentences(t);
    for (var i = 0; i < ss.length; i++) if (re.test(ss[i]) && ss[i].split(" ").length <= 20) return ss[i];
    var m = re.exec(t); if (!m) return "";
    var words = t.split(/\s+/), pos = t.slice(0, m.index).split(/\s+/).length - 1, a = Math.max(0, pos - 5), b = Math.min(words.length, pos + 8);
    return (a > 0 ? "\u2026" : "") + words.slice(a, b).join(" ") + (b < words.length ? "\u2026" : "");
  }
  /* the evidence shown is the shortest sentence that matches every pattern, so the quote really shows the point */
  function evidence(text, all) {
    var ss = sentences(text).filter(function (x) { return all.every(function (r) { return r.test(x); }); }).sort(function (a, b) { return a.length - b.length; });
    if (ss.length && ss[0].split(" ").length <= 30) return ss[0];
    return around(text, all[0]);
  }
  function rx(s) { return s instanceof RegExp ? s : new RegExp(s, "i"); }

  function quick(rubric, text) {
    var items = rubric.items.map(function (it) {
      var all = (it.all || []).map(rx), hit = all.every(function (r) { return r.test(text); });
      return { id: it.id, label: it.label, tip: it.tip, met: hit, quote: hit ? evidence(text, all) : "" };
    });
    var flags = (rubric.flags || []).filter(function (f) { return rx(f.re).test(text); }).map(function (f) { return { quote: around(text, rx(f.re)), why: f.why }; });
    return { mode: "quick", items: items, flags: flags };
  }

  function prompt(rubric, text, L) {
    return [
      "You are Warmup's practice coach for canvassers. A canvasser just answered a voter out loud (speech-to-text, so ignore spelling and missing punctuation).",
      "Judge ONLY what the canvasser actually said. Never credit a point they didn't make, even partly. Be strict about facts and generous about wording.",
      "",
      "The voter asked: " + rubric.ask,
      "",
      "Approved facts for this lesson (anything that contradicts these is a misstatement; a claim not covered here is unsupported, not wrong):",
      rubric.facts.map(function (f) { return "- " + f; }).join("\n"),
      "",
      "Rubric points:",
      rubric.items.map(function (it) { return "- id \"" + it.id + "\": " + it.ai; }).join("\n"),
      "",
      "Watch for these misstatements:",
      (rubric.flags || []).map(function (f) { return "- " + f.why; }).join("\n") || "- (none listed)",
      "",
      "The canvasser said:",
      "\"\"\"" + text + "\"\"\"",
      "",
      "Return only JSON with this shape:",
      '{"items":[{"id":"...","met":true|false,"quote":"the canvasser\'s exact words that show it, copied character for character, or empty"}],',
      ' "flags":[{"quote":"exact words","why":"one plain sentence on what is inaccurate or unfair"}],',
      ' "strength":"one sentence naming something specific they did well, quoting a few of their words",',
      ' "next":"one sentence: the single most useful thing to add or fix next time, in words they could say"}',
      "Write like a friendly field organizer: plain words, complete sentences, no em dashes."
    ].join("\n");
  }

  /* resolve the AI channel once: the artifact runtime's sample capability, or a server endpoint */
  var aiP = null;
  function ai() {
    if (aiP) return aiP;
    aiP = new Promise(function (res) {
      if (WU.coach.endpoint) return res({ kind: "endpoint" });
      if (!window.claude || !window.claude.use) return res(null);
      var done = false, t = setTimeout(function () { if (!done) { done = true; res(null); } }, 6000);
      window.claude.use("sample").then(function (s) { if (!done) { done = true; clearTimeout(t); res(s ? { kind: "sample", s: s } : null); } }, function () { if (!done) { done = true; clearTimeout(t); res(null); } });
    });

      var q = String(got.quote || "").trim(), ok = !!got.met && q.length >= 4 && T.indexOf(norm(q).replace(/[….]+$/, "")) >= 0;
      return { id: it.id, label: it.label, tip: it.tip, met: ok, quote: ok ? q : "", dropped: !!got.met && !ok };
    });
    var flags = (out.flags || []).filter(function (f) { return f && f.quote && T.indexOf(norm(f.quote)) >= 0; }).map(function (f) { return { quote: f.quote, why: String(f.why || "") }; });
    return { mode: "ai", items: items, flags: flags, strength: String(out.strength || ""), next: String(out.next || "") };
  }

  WU.coach = {
    endpoint: null,
    available: function () { return ai().then(function (a) { return !!a; }); },
    grade: function (rubric, text, L) {
      var base = quick(rubric, text);

        var p = prompt(rubric, text, L), call;
        if (a.kind === "sample") call = a.s.json(p, { modelTier: "default" });
        else call = fetch(WU.coach.endpoint, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt: p }) }).then(function (r) { if (!r.ok) throw new Error("coach " + r.status); return r.json(); });
        var timeout = new Promise(function (_, rej) { setTimeout(function () { rej(new Error("timeout")); }, 25000); });
        return Promise.race([call, timeout]).then(function (out) { return finish(validate(rubric, text, out || {})); }, function (e) { var r = finish(base); r.fellBack = String(e && (e.code || e.message) || e); return r; });
      });
      function finish(r) {
        var met = r.items.filter(function (x) { return x.met; }), miss = r.items.filter(function (x) { return !x.met; });
        if (!r.strength) r.strength = met.length ? "You " + met[0].label.charAt(0).toLowerCase() + met[0].label.slice(1).replace(/\.$/, "") + "." : "";
        if (!r.next) r.next = miss.length ? miss[0].tip : (r.flags.length ? "Fix the line marked \u201CCheck this\u201D and you\u2019ve got it." : "");
        r.score = met.length; r.of = r.items.length; r.text = text;
        return r;
      }
    },
    quick: quick
  };
})();
